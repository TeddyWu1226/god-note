<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="100%" height="100%" shape-rendering="crispEdges">
  

  <!-- Book Cover (Brown / Leather) -->
  <rect x="2" y="6" width="12" height="7" fill="#8d6e63" />
  <rect x="3" y="13" width="10" height="1" fill="#5d4037" />

  <!-- Book Pages (Open - White/Beige) -->
  <!-- Left Page -->
  <rect x="3" y="6" width="5" height="6" fill="#f5f5f5" />
  <!-- Right Page -->
  <rect x="8" y="6" width="5" height="6" fill="#eeeeee" />

  <!-- Page Shadows & Details -->
  <rect x="3" y="12" width="10" height="1" fill="#bdbdbd" />
  <rect x="2" y="5" width="12" height="1" fill="#1b1c20" />
  <rect x="7" y="6" width="2" height="6" fill="#e0e0e0" /> <!-- spine shadow -->

  <!-- Book Spine / Bookmark Ribbon (Red) -->
  <rect x="7" y="5" width="2" height="1" fill="#c0392b" />
  <rect x="8" y="6" width="1" height="7" fill="#e74c3c" />

  <!-- Magic Words / Script Lines (Blue/Cyan) -->
  <rect x="4" y="8" width="2" height="1" fill="#29b6f6" />
  <rect x="4" y="10" width="2" height="1" fill="#29b6f6" />
  <rect x="10" y="8" width="2" height="1" fill="#29b6f6" />
  <rect x="10" y="10" width="2" height="1" fill="#29b6f6" />
  
  <!-- Glowing Runes floating up -->
  <rect x="5" y="3" width="1" height="1" fill="#00e5ff" />
  <rect x="10" y="3" width="1" height="1" fill="#00e5ff" />
  <rect x="8" y="2" width="1" height="1" fill="#00e5ff" />
</svg>
