<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="100%" height="100%" shape-rendering="crispEdges">
  <!-- Retro Item Frame (Border Only, Transparent Background) -->
  <rect x="0.5" y="0.5" width="15" height="15" fill="none" stroke="#3d3d4e" stroke-width="1" rx="0.5" ry="0.5" />

  <!-- Magic Waves / Ambient aura -->
  <rect x="4" y="4" width="1" height="1" fill="#8e44ad" />
  <rect x="3" y="9" width="1" height="1" fill="#9b59b6" />
  <rect x="12" y="5" width="1" height="1" fill="#a5d8ff" />
  <rect x="11" y="11" width="2" height="1" fill="#8e44ad" />

  <!-- Magic Ball Core Sphere (Arcane Blue) -->
  <!-- Outer Dark Blue Boundary -->
  <rect x="6" y="4" width="4" height="8" fill="#1a3d54" />
  <rect x="4" y="6" width="8" height="4" fill="#1a3d54" />
  <rect x="5" y="5" width="6" height="6" fill="#1a3d54" />

  <!-- Mid Blue Tone -->
  <rect x="6" y="5" width="4" height="6" fill="#2980b9" />
  <rect x="5" y="6" width="6" height="4" fill="#2980b9" />

  <!-- Bright Cyan Core -->
  <rect x="6" y="6" width="4" height="4" fill="#3498db" />
  <rect x="7" y="5" width="2" height="1" fill="#3498db" />
  <rect x="5" y="7" width="1" height="2" fill="#3498db" />

  <!-- Highlights (Light Cyan and Sparkle White) -->
  <rect x="6" y="6" width="2" height="2" fill="#a5d8ff" />
  <rect x="6" y="6" width="1" height="1" fill="#ffffff" />
  <rect x="7" y="7" width="1" height="1" fill="#ffffff" />
  
  <!-- Backside Arcane Trail -->
  <rect x="10" y="9" width="2" height="2" fill="#8e44ad" />
  <rect x="12" y="10" width="1" height="1" fill="#9b59b6" />
</svg>
