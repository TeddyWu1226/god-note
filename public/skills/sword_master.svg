  <rect x="13" y="2" width="1" height="1" fill="#ffffff" />
  <rect x="13" y="1" width="1" height="1" fill="#f1c40f" />
  <rect x="13" y="3" width="1" height="1" fill="#f1c40f" />
  <rect x="12" y="2" width="1" height="1" fill="#f1c40f" />
  <rect x="14" y="2" width="1" height="1" fill="#f1c40f" />

  <!-- Radiant Cross Star 2 (Left of blade) -->
  <rect x="3" y="6" width="1" height="1" fill="#ffffff" />
  <rect x="3" y="5" width="1" height="1" fill="#f1c40f" />
  <rect x="3" y="7" width="1" height="1" fill="#f1c40f" />
  <rect x="2" y="6" width="1" height="1" fill="#f1c40f" />
  <rect x="4" y="6" width="1" height="1" fill="#f1c40f" />

  <!-- Radiant Cross Star 3 (Bottom-right of guard) -->
  <rect x="8" y="11" width="1" height="1" fill="#ffffff" />
  <rect x="8" y="10" width="1" height="1" fill="#f1c40f" />
  <rect x="8" y="12" width="1" height="1" fill="#f1c40f" />
  <rect x="7" y="11" width="1" height="1" fill="#f1c40f" />
