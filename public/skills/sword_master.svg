<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="100%" height="100%" shape-rendering="crispEdges">
  <!-- Single Sword (from sword_mastery.svg) -->
  <!-- Hilt & Handle -->
  <rect x="3" y="12" width="1" height="1" fill="#795548" />
  <rect x="4" y="11" width="1" height="1" fill="#5d4037" />
  
  <!-- Hand Guard (Gold) -->
  <rect x="3" y="10" width="1" height="1" fill="#f1c40f" />
  <rect x="4" y="10" width="1" height="1" fill="#f1c40f" />
  <rect x="5" y="10" width="1" height="1" fill="#f1c40f" />
  <rect x="5" y="11" width="1" height="1" fill="#f1c40f" />

  <!-- Blade (Silver & Highlights) -->
  <rect x="5" y="9" width="1" height="1" fill="#7f8c8d" />
  <rect x="6" y="9" width="1" height="1" fill="#ecf0f1" />
  
  <rect x="6" y="8" width="1" height="1" fill="#7f8c8d" />
  <rect x="7" y="8" width="1" height="1" fill="#ecf0f1" />
  
  <rect x="7" y="7" width="1" height="1" fill="#7f8c8d" />
  <rect x="8" y="7" width="1" height="1" fill="#ecf0f1" />
  
  <rect x="8" y="6" width="1" height="1" fill="#bdc3c7" />
