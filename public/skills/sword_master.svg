  <rect x="1" y="2" width="1" height="1" fill="#f39c12" />
  <rect x="6" y="2" width="1" height="1" fill="#f1c40f" />
  <rect x="1" y="8" width="1" height="1" fill="#f1c40f" />
  <rect x="10" y="13" width="1" height="1" fill="#f39c12" />
