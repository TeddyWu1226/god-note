<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="100%" height="100%" shape-rendering="crispEdges">
  <!-- Retro Item Frame (Border Only, Transparent Background) -->
  <rect x="0.5" y="0.5" width="15" height="15" fill="none" stroke="#3d3d4e" stroke-width="1" rx="0.5" ry="0.5" />

  <!-- Speed Lines / Wind Trails (indicating direction from top-left) -->
  <rect x="5" y="3" width="2" height="1" fill="#bdc3c7" opacity="0.6" />
  <rect x="3" y="5" width="1" height="2" fill="#bdc3c7" opacity="0.6" />
  <rect x="2" y="2" width="1" height="1" fill="#7f8c8d" opacity="0.4" />

  <!-- Wooden Club / Staff (aligned from top-left to bottom-right) -->
  <!-- Handle Grip -->
  <rect x="3" y="3" width="1" height="1" fill="#a1887f" />
  <rect x="4" y="3" width="1" height="1" fill="#5d4037" />
  <rect x="3" y="4" width="1" height="1" fill="#5d4037" />

  <!-- Shaft -->
  <rect x="4" y="4" width="1" height="1" fill="#8d6e63" />
  <rect x="5" y="5" width="1" height="1" fill="#8d6e63" />
  <rect x="5" y="4" width="1" height="1" fill="#a1887f" /> <!-- shaft highlight -->
  <rect x="4" y="5" width="1" height="1" fill="#5d4037" /> <!-- shaft shadow -->

  <rect x="6" y="6" width="1" height="1" fill="#8d6e63" />
  <rect x="6" y="5" width="1" height="1" fill="#a1887f" />
  <rect x="5" y="6" width="1" height="1" fill="#5d4037" />

  <!-- Club head (gradually thicker) -->
  <rect x="7" y="7" width="1" height="1" fill="#795548" />
  <rect x="7" y="6" width="1" height="1" fill="#a1887f" />
  <rect x="6" y="7" width="1" height="1" fill="#5d4037" />

  <rect x="8" y="8" width="1" height="1" fill="#795548" />
  <rect x="8" y="7" width="1" height="1" fill="#d7ccc8" /> <!-- head highlight -->
  <rect x="7" y="8" width="1" height="1" fill="#3e2723" /> <!-- head shadow -->

  <rect x="9" y="9" width="2" height="1" fill="#795548" />
  <rect x="9" y="8" width="1" height="1" fill="#d7ccc8" />
  <rect x="8" y="9" width="1" height="1" fill="#3e2723" />

  <rect x="10" y="10" width="2" height="1" fill="#795548" />
  <rect x="10" y="9" width="1" height="1" fill="#d7ccc8" />
  <rect x="9" y="10" width="1" height="1" fill="#3e2723" />

  <!-- Club Tip -->
  <rect x="11" y="11" width="1" height="1" fill="#d7ccc8" />
  <rect x="11" y="10" width="1" height="1" fill="#795548" />
  <rect x="10" y="11" width="1" height="1" fill="#3e2723" />

  <!-- Thrust impact flare (at tip of club x=11, y=11) -->
  <!-- White core impact -->
  <rect x="12" y="12" width="2" height="2" fill="#ffffff" />
  <rect x="11" y="12" width="1" height="1" fill="#ffffff" />
  <rect x="12" y="11" width="1" height="1" fill="#ffffff" />
  <rect x="13" y="13" width="2" height="2" fill="#ffffff" />

  <!-- Blue shockwave energy -->
  <rect x="10" y="12" width="1" height="1" fill="#3498db" />
  <rect x="12" y="10" width="1" height="1" fill="#3498db" />
  <rect x="11" y="13" width="1" height="1" fill="#3498db" />
  <rect x="13" y="11" width="1" height="1" fill="#3498db" />
  <rect x="14" y="12" width="1" height="1" fill="#3498db" />
  <rect x="12" y="14" width="1" height="1" fill="#3498db" />
  <rect x="14" y="14" width="1" height="1" fill="#8ec6eb" />
  <rect x="13" y="12" width="1" height="1" fill="#8ec6eb" />
  <rect x="12" y="13" width="1" height="1" fill="#8ec6eb" />
</svg>
