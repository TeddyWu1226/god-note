<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="100%" height="100%" shape-rendering="crispEdges">
  <!-- Retro Item Frame -->
  <rect width="16" height="16" fill="#121216" rx="1" ry="1" />
  <rect x="1" y="1" width="14" height="14" fill="#3d3d4e" />
  <rect x="2" y="2" width="12" height="12" fill="#1b1c22" />

  <!-- Rapier Sword (aligned diagonally) -->
  <!-- Pommel -->
  <rect x="3" y="12" width="1" height="1" fill="#7f8c8d" />
  <!-- Grip / Handle -->
  <rect x="4" y="11" width="1" height="1" fill="#c0392b" />
  
  <!-- Round Guard (Rapier style) -->
  <rect x="4" y="10" width="2" height="1" fill="#f1c40f" />
  <rect x="5" y="9" width="1" height="2" fill="#f1c40f" />

  <!-- Rapier thin blade -->
  <rect x="6" y="9" width="1" height="1" fill="#bdc3c7" />
  <rect x="7" y="8" width="1" height="1" fill="#ecf0f1" />
  <rect x="8" y="7" width="1" height="1" fill="#bdc3c7" />
  <rect x="9" y="6" width="1" height="1" fill="#ecf0f1" />
  <rect x="10" y="5" width="1" height="1" fill="#ffffff" />
  <rect x="11" y="4" width="1" height="1" fill="#ffffff" />

  <!-- Thrust impact flare (at tip of blade x=11, y=4) -->
  <!-- White core impact -->
  <rect x="11" y="3" width="2" height="2" fill="#ffffff" />
  <rect x="12" y="2" width="2" height="2" fill="#ffffff" />
  <rect x="13" y="1" width="1" height="1" fill="#ffffff" />

  <!-- Blue shockwave energy -->
  <rect x="10" y="3" width="1" height="1" fill="#3498db" />
  <rect x="11" y="2" width="1" height="1" fill="#3498db" />
  <rect x="13" y="2" width="1" height="1" fill="#3498db" />
  <rect x="12" y="4" width="1" height="1" fill="#3498db" />
  <rect x="13" y="3" width="1" height="1" fill="#3498db" />
  <rect x="14" y="2" width="1" height="1" fill="#3498db" />
  
  <rect x="9" y="4" width="1" height="1" fill="#8ec6eb" />
  <rect x="12" y="1" width="1" height="1" fill="#8ec6eb" />

  <!-- Speed lines (indicating thrust direction) -->
  <rect x="5" y="8" width="1" height="1" fill="#34495e" />
  <rect x="4" y="9" width="1" height="1" fill="#34495e" />
  <rect x="8" y="5" width="1" height="1" fill="#34495e" />
  <rect x="7" y="6" width="1" height="1" fill="#34495e" />
</svg>
