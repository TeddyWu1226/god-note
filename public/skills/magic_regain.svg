<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="100%" height="100%" shape-rendering="crispEdges">
  <!-- Retro Item Frame -->
  <rect width="16" height="16" fill="#121216" rx="1" ry="1" />
  <rect x="1" y="1" width="14" height="14" fill="#3d3d4e" />
  <rect x="2" y="2" width="12" height="12" fill="#1b201a" />

  <!-- Soil / Earth at bottom -->
  <rect x="4" y="12" width="8" height="2" fill="#8e5a32" />
  <rect x="5" y="11" width="6" height="1" fill="#8e5a32" />
  <rect x="3" y="13" width="10" height="1" fill="#5c3a21" />

  <!-- Sprout Stem (Green) -->
  <rect x="7" y="8" width="2" height="4" fill="#27ae60" />
  <rect x="7" y="9" width="1" height="3" fill="#2ecc71" />

  <!-- Left Leaf -->
  <rect x="5" y="7" width="2" height="1" fill="#2ecc71" />
  <rect x="6" y="8" width="1" height="1" fill="#27ae60" />
  <rect x="4" y="6" width="2" height="1" fill="#a2f2b7" />
  <rect x="5" y="7" width="1" height="1" fill="#a2f2b7" />

  <!-- Right Leaf -->
  <rect x="9" y="7" width="2" height="1" fill="#2ecc71" />
  <rect x="9" y="8" width="1" height="1" fill="#27ae60" />
  <rect x="10" y="6" width="2" height="1" fill="#a2f2b7" />
  <rect x="10" y="7" width="1" height="1" fill="#a2f2b7" />

  <!-- Magic Aura / Sparkles (Blue & White) -->
  <rect x="3" y="4" width="1" height="1" fill="#3498db" />
  <rect x="12" y="4" width="1" height="1" fill="#3498db" />
  <rect x="7" y="4" width="2" height="2" fill="#a5d8ff" />
  <rect x="8" y="5" width="1" height="1" fill="#ffffff" />
  <rect x="7" y="3" width="1" height="1" fill="#ffffff" />
  <rect x="4" y="10" width="1" height="1" fill="#3498db" />
  <rect x="11" y="9" width="1" height="1" fill="#a5d8ff" />
</svg>
