<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="100%" height="100%" shape-rendering="crispEdges">
  <!-- Retro Item Frame (Border Only, Transparent Background) -->
  <rect x="0.5" y="0.5" width="15" height="15" fill="none" stroke="#3d3d4e" stroke-width="1" rx="0.5" ry="0.5" />

  <!-- Shield Outline (Dark Golden Bronze) -->
  <rect x="4" y="2" width="8" height="1" fill="#b78408" />
  <rect x="3" y="3" width="10" height="9" fill="#b78408" />
  <rect x="4" y="12" width="8" height="1" fill="#b78408" />
  <rect x="5" y="13" width="6" height="1" fill="#b78408" />
  <rect x="7" y="14" width="2" height="1" fill="#b78408" />

  <!-- Shield Inner Gold Fill -->
  <rect x="4" y="4" width="8" height="8" fill="#f1c40f" />
  <rect x="5" y="3" width="6" height="1" fill="#f1c40f" />
  <rect x="5" y="12" width="6" height="1" fill="#f1c40f" />
  <rect x="6" y="13" width="4" height="1" fill="#f1c40f" />

  <!-- Left Side Highlights (Pale Gold) -->
  <rect x="4" y="3" width="1" height="9" fill="#f9e79f" />
  <rect x="5" y="3" width="1" height="10" fill="#f9e79f" />
  <rect x="6" y="4" width="1" height="9" fill="#f9e79f" />

  <!-- Right Side Shadows (Dark Orange Bronze) -->
  <rect x="10" y="3" width="1" height="10" fill="#d35400" />
  <rect x="11" y="3" width="1" height="9" fill="#d35400" />
  
  <!-- Glowing Center Diamond (Willpower Light) -->
  <rect x="7" y="5" width="2" height="6" fill="#ffffff" />
  <rect x="5" y="7" width="6" height="2" fill="#ffffff" />
  
  <!-- Glowing Diamond Cyan Outline/Aura -->
  <rect x="7" y="4" width="2" height="1" fill="#00ffff" />
  <rect x="7" y="11" width="2" height="1" fill="#00ffff" />
  <rect x="4" y="7" width="1" height="2" fill="#00ffff" />
  <rect x="11" y="7" width="1" height="2" fill="#00ffff" />
  
  <rect x="6" y="5" width="1" height="1" fill="#00ffff" />
  <rect x="9" y="5" width="1" height="1" fill="#00ffff" />
  <rect x="6" y="10" width="1" height="1" fill="#00ffff" />
  <rect x="9" y="10" width="1" height="1" fill="#00ffff" />
</svg>
