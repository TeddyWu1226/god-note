<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="100%" height="100%" shape-rendering="crispEdges">
  <!-- Retro Item Frame (Border Only, Transparent Background) -->
  <rect x="0.5" y="0.5" width="15" height="15" fill="none" stroke="#3d3d4e" stroke-width="1" rx="0.5" ry="0.5" />

  <!-- Shield Shape (Silver / Steel Gray) -->
  <rect x="5" y="3" width="6" height="1" fill="#7f8c8d" />
  <rect x="4" y="4" width="8" height="1" fill="#bdc3c7" />
  <rect x="3" y="5" width="10" height="4" fill="#bdc3c7" />
  <rect x="4" y="9" width="8" height="2" fill="#95a5a6" />
  <rect x="5" y="11" width="6" height="1" fill="#95a5a6" />
  <rect x="6" y="12" width="4" height="1" fill="#7f8c8d" />
  <rect x="7" y="13" width="2" height="1" fill="#7f8c8d" />

  <!-- Golden Cross on Shield -->
  <rect x="7" y="4" width="2" height="8" fill="#f1c40f" />
  <rect x="5" y="6" width="6" height="2" fill="#f1c40f" />
  <rect x="7" y="6" width="2" height="2" fill="#f39c12" />

  <!-- Shield Highlights -->
  <rect x="4" y="5" width="1" height="4" fill="#ffffff" />
  <rect x="5" y="4" width="1" height="1" fill="#ffffff" />
</svg>
