<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="100%" height="100%" shape-rendering="crispEdges">
  <!-- Retro Item Frame -->
  <rect x="0.5" y="0.5" width="15" height="15" fill="none" stroke="#3d3d4e" stroke-width="1" rx="0.5" ry="0.5" />

  <!-- Swift Motion Trail (Vibrant Gold & Yellow Wind Lines) -->
  <rect x="1" y="13" width="1" height="1" fill="#e67e22" />
  <rect x="2" y="11" width="1" height="1" fill="#f1c40f" />
  <rect x="3" y="12" width="2" height="1" fill="#f1c40f" opacity="0.6" />
  <rect x="3" y="9" width="1" height="1" fill="#e67e22" />
  <rect x="4" y="10" width="1" height="1" fill="#f1c40f" />
  
  <rect x="4" y="7" width="2" height="1" fill="#f39c12" />
  <rect x="5" y="8" width="1" height="1" fill="#ffffff" />
  
  <rect x="6" y="5" width="2" height="1" fill="#f1c40f" />
  <rect x="7" y="6" width="1" height="1" fill="#ffffff" />

  <!-- Lightning Arcs / Sparking Energy -->
  <rect x="7" y="11" width="1" height="1" fill="#f1c40f" />
  <rect x="8" y="10" width="1" height="2" fill="#ffffff" />
  <rect x="9" y="9" width="1" height="1" fill="#f39c12" />

  <rect x="3" y="4" width="2" height="1" fill="#f1c40f" />
  <rect x="4" y="3" width="1" height="1" fill="#ffffff" />
  <rect x="5" y="2" width="1" height="1" fill="#f39c12" />

  <!-- Godspeed Forward Pierce (Diagonal Gold speed lines) -->
  <rect x="8" y="4" width="2" height="1" fill="#f1c40f" />
  <rect x="9" y="3" width="2" height="1" fill="#f39c12" />
  <rect x="10" y="2" width="2" height="1" fill="#ffffff" />
  <rect x="11" y="1" width="3" height="1" fill="#f1c40f" />


  <!-- Dagger Pommel & Handle -->
  <rect x="2" y="13" width="1" height="1" fill="#e74c3c" />
  <rect x="3" y="12" width="1" height="1" fill="#d35400" />
  <rect x="4" y="11" width="1" height="1" fill="#f1c40f" />
  
  <!-- Hand Guard (Gold & Ruby gem) -->
  <rect x="3" y="10" width="1" height="1" fill="#e67e22" />
  <rect x="4" y="10" width="1" height="1" fill="#f1c40f" />
  <rect x="5" y="10" width="1" height="1" fill="#f1c40f" />
  <rect x="5" y="11" width="1" height="1" fill="#e74c3c" />

  <!-- Dagger Blade (Glowing Golden-White Core) -->
  <rect x="5" y="9" width="1" height="1" fill="#f39c12" />
  <rect x="6" y="9" width="1" height="1" fill="#ffffff" />
  
  <rect x="6" y="8" width="1" height="1" fill="#f1c40f" />
  <rect x="7" y="8" width="1" height="1" fill="#ffffff" />
  
  <rect x="7" y="7" width="1" height="1" fill="#f1c40f" />
  <rect x="8" y="7" width="1" height="1" fill="#ffffff" />
  
  <!-- Blade Tip -->
  <rect x="8" y="6" width="1" height="1" fill="#ffffff" />
  
  <!-- Lightning Flares at Tip -->
  <rect x="9" y="5" width="2" height="1" fill="#ffffff" />
  <rect x="10" y="6" width="1" height="1" fill="#f1c40f" />
  <rect x="10" y="4" width="1" height="1" fill="#f1c40f" />
  <rect x="11" y="5" width="1" height="1" fill="#f39c12" />
</svg>
