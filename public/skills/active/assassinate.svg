<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="100%" height="100%" shape-rendering="crispEdges">
  <!-- Active Skill Border -->
  <rect x="0.5" y="0.5" width="15" height="15" fill="none" stroke="#3d3d4e" stroke-width="1" rx="0.5" ry="0.5" />

  <!-- Shadow background (Dark Crimson / Purple) -->
  <rect x="2" y="2" width="12" height="12" fill="#2c1a32" />
  <rect x="3" y="3" width="10" height="10" fill="#1b0a21" />

  <!-- Crimson Slash effect (Diagonal from top-left to bottom-right) -->
  <rect x="4" y="4" width="2" height="2" fill="#c0392b" />
  <rect x="6" y="6" width="4" height="4" fill="#e74c3c" />
  <rect x="10" y="10" width="2" height="2" fill="#ffffff" />
  
  <!-- Lethal assassination golden sparks at the center -->
  <rect x="8" y="7" width="1" height="1" fill="#f1c40f" />
  <rect x="7" y="8" width="1" height="1" fill="#f1c40f" />
  <rect x="8" y="8" width="2" height="2" fill="#ffffff" />
  
  <!-- Dagger blade silhouette stabbing diagonally up-right -->
  <rect x="4" y="11" width="1" height="1" fill="#7f8c8d" />
  <rect x="5" y="10" width="1" height="1" fill="#bdc3c7" />
  <rect x="6" y="9" width="1" height="1" fill="#ffffff" />
</svg>
