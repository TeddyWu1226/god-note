<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="100%" height="100%" shape-rendering="crispEdges">
  <!-- Active Skill Border -->
  <rect x="0.5" y="0.5" width="15" height="15" fill="none" stroke="#3d3d4e" stroke-width="1" rx="0.5" ry="0.5" />

  <!-- Dagger 1 (Slanted Up-Right, top half) --><!-- Blade tip -->
  <rect x="8" y="3" width="2" height="1" fill="#ecf0f1" />
  <rect x="6" y="4" width="2" height="1" fill="#bdc3c7" />
  <rect x="5" y="5" width="1" height="1" fill="#f1c40f" /> <!-- Guard -->
  <rect x="4" y="6" width="1" height="1" fill="#7e5109" /> <!-- Hilt -->

  <!-- Dagger 2 (Straight Right, middle) --><!-- Blade tip -->
  <rect x="10" y="7" width="2" height="1" fill="#ecf0f1" />
  <rect x="8" y="8" width="2" height="1" fill="#bdc3c7" />
  <rect x="7" y="8" width="1" height="1" fill="#f1c40f" /> <!-- Guard -->
  <rect x="6" y="9" width="1" height="1" fill="#7e5109" /> <!-- Hilt -->

  <!-- Dagger 3 (Slanted Down-Right, bottom half) -->
  <rect x="8" y="12" width="2" height="1" fill="#ecf0f1" />
  <rect x="6" y="11" width="2" height="1" fill="#bdc3c7" />
  <rect x="5" y="10" width="1" height="1" fill="#f1c40f" /> <!-- Guard -->
  <rect x="4" y="9" width="1" height="1" fill="#7e5109" /> <!-- Hilt -->

  <!-- Stabbing Motion Speed Trails -->
  <rect x="2" y="4" width="2" height="1" fill="#bdc3c7" opacity="0.4" />
  <rect x="3" y="8" width="3" height="1" fill="#bdc3c7" opacity="0.4" />
  <rect x="2" y="11" width="2" height="1" fill="#bdc3c7" opacity="0.4" />

  <!-- Spark/Stab impact points -->
  <rect x="10" y="2" width="1" height="1" fill="#f1c40f" />
  <rect x="12" y="7" width="1" height="1" fill="#f1c40f" />
  <rect x="10" y="13" width="1" height="1" fill="#f1c40f" />
</svg>
