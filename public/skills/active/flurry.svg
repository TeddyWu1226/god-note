<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="100%" height="100%" shape-rendering="crispEdges">
  <!-- Retro Item Frame (Border Only, Transparent Background) -->
  <rect x="0.5" y="0.5" width="15" height="15" fill="none" stroke="#3d3d4e" stroke-width="1" rx="0.5" ry="0.5" />

  <!-- Ghost Blade 1 (Left Swing Blur - Lighter Cyan) -->
  <rect x="4" y="9" width="1" height="1" fill="#00e5ff" opacity="0.4" />
  <rect x="5" y="8" width="1" height="1" fill="#00e5ff" opacity="0.5" />
  <rect x="5" y="7" width="1" height="1" fill="#00e5ff" opacity="0.6" />
  <rect x="6" y="6" width="1" height="1" fill="#8ec6eb" opacity="0.6" />
  <rect x="7" y="5" width="1" height="1" fill="#8ec6eb" opacity="0.7" />
  <rect x="8" y="4" width="1" height="1" fill="#ffffff" opacity="0.7" />
  <rect x="8" y="3" width="1" height="1" fill="#ffffff" opacity="0.8" />

  <!-- Ghost Blade 2 (Right Swing Blur - Light Blue) -->
  <rect x="5" y="10" width="1" height="1" fill="#29b6f6" opacity="0.4" />
  <rect x="6" y="10" width="1" height="1" fill="#29b6f6" opacity="0.5" />
  <rect x="7" y="9" width="1" height="1" fill="#29b6f6" opacity="0.6" />
  <rect x="8" y="9" width="1" height="1" fill="#8ec6eb" opacity="0.6" />
  <rect x="9" y="8" width="1" height="1" fill="#8ec6eb" opacity="0.7" />
  <rect x="11" y="7" width="1" height="1" fill="#ffffff" opacity="0.7" />
  <rect x="12" y="7" width="1" height="1" fill="#ffffff" opacity="0.8" />

  <!-- Main Weapon (Sword in the Center - Solid colors) -->
  <!-- Pommel -->
  <rect x="3" y="12" width="1" height="1" fill="#7f8c8d" />
  <!-- Grip -->
  <rect x="4" y="11" width="1" height="1" fill="#c0392b" />
  <!-- Guard -->
  <rect x="4" y="10" width="2" height="1" fill="#f1c40f" />
  <rect x="5" y="9" width="1" height="2" fill="#f1c40f" />
  <!-- Blade -->
  <rect x="6" y="9" width="1" height="1" fill="#bdc3c7" />
  <rect x="7" y="8" width="1" height="1" fill="#bdc3c7" />
  <rect x="8" y="7" width="1" height="1" fill="#ffffff" />
  <rect x="9" y="6" width="1" height="1" fill="#ffffff" />
  <rect x="10" y="5" width="1" height="1" fill="#ffffff" />
  <rect x="11" y="4" width="1" height="1" fill="#ffffff" />

  <!-- Curved Swing Motion Trails (Wind / Slash arcs) -->
  <!-- Outer Arc (Top-Right to Right) -->
  <rect x="8" y="2" width="2" height="1" fill="#ffffff" />
  <rect x="10" y="2" width="1" height="1" fill="#00e5ff" />
  <rect x="11" y="3" width="1" height="1" fill="#ffffff" />
  <rect x="12" y="4" width="1" height="1" fill="#00e5ff" />
  <rect x="13" y="5" width="1" height="2" fill="#29b6f6" />
  <rect x="13" y="7" width="1" height="1" fill="#0288d1" />

  <!-- Inner Arc -->
  <rect x="7" y="3" width="1" height="1" fill="#00e5ff" opacity="0.7" />
  <rect x="9" y="4" width="2" height="1" fill="#ffffff" opacity="0.8" />
  <rect x="11" y="5" width="1" height="1" fill="#00e5ff" opacity="0.8" />
  <rect x="12" y="6" width="1" height="1" fill="#29b6f6" opacity="0.7" />

  <!-- Left Side Arc (Start of swing) -->
  <rect x="3" y="8" width="1" height="2" fill="#29b6f6" opacity="0.5" />
  <rect x="4" y="7" width="1" height="1" fill="#00e5ff" opacity="0.6" />
  <rect x="5" y="6" width="1" height="1" fill="#ffffff" opacity="0.7" />
</svg>
