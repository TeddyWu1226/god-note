<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="100%" height="100%" shape-rendering="crispEdges">
  <!-- Active Skill Border -->
  <rect x="0.5" y="0.5" width="15" height="15" fill="none" stroke="#3d3d4e" stroke-width="1" rx="0.5" ry="0.5" />

  <!-- Circular wind vortex background (Gray/Silver) -->
  <rect x="5" y="3" width="6" height="10" fill="#bdc3c7" opacity="0.2" />
  <rect x="3" y="5" width="10" height="6" fill="#bdc3c7" opacity="0.2" />

  <!-- Spinning flying daggers (4 small daggers angled in circular pattern) -->
  <!-- Dagger 1 (Top pointing right) -->
  <rect x="7" y="3" width="3" height="1" fill="#ffffff" />
  <rect x="6" y="4" width="1" height="1" fill="#f1c40f" />
  
  <!-- Dagger 2 (Right pointing down) -->
  <rect x="12" y="7" width="1" height="3" fill="#ffffff" />
  <rect x="11" y="6" width="1" height="1" fill="#f1c40f" />

  <!-- Dagger 3 (Bottom pointing left) -->
  <rect x="6" y="12" width="3" height="1" fill="#ffffff" />
  <rect x="9" y="11" width="1" height="1" fill="#f1c40f" />

  <!-- Dagger 4 (Left pointing up) -->
  <rect x="3" y="6" width="1" height="3" fill="#ffffff" />
  <rect x="4" y="9" width="1" height="1" fill="#f1c40f" />

  <!-- Center Pivot / Spin sparkles -->
  <rect x="7" y="7" width="2" height="2" fill="#ecf0f1" />
  <rect x="5" y="5" width="1" height="1" fill="#3498db" />
  <rect x="10" y="10" width="1" height="1" fill="#3498db" />
</svg>
