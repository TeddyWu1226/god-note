<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="100%" height="100%" shape-rendering="crispEdges">
  <!-- Retro Item Frame -->
  <rect x="0.5" y="0.5" width="15" height="15" fill="none" stroke="#3d3d4e" stroke-width="1" rx="0.5" ry="0.5" />

  <!-- Diagonal Sword -->
  <rect x="2" y="13" width="1" height="1" fill="#7f8c8d" />
  <rect x="3" y="12" width="1" height="1" fill="#bdc3c7" />
  <rect x="4" y="11" width="1" height="1" fill="#34495e" />
  <rect x="4" y="10" width="2" height="2" fill="#7f8c8d" />
  <rect x="5" y="9" width="1" height="1" fill="#bdc3c7" />
  <rect x="6" y="8" width="1" height="1" fill="#ecf0f1" />
  <rect x="7" y="7" width="1" height="1" fill="#ecf0f1" />
  <rect x="8" y="6" width="1" height="1" fill="#ecf0f1" />
  <rect x="9" y="5" width="1" height="1" fill="#ecf0f1" />
  <rect x="10" y="4" width="1" height="1" fill="#ecf0f1" />

  <!-- Glowing Blue Sword Qi Waves -->
  <!-- Inner Wave (Light Cyan) -->
  <rect x="11" y="2" width="2" height="2" fill="#e0ffff" />
  <rect x="10" y="3" width="2" height="2" fill="#00ffff" />
  <rect x="9" y="4" width="2" height="2" fill="#00ffff" />
  <!-- Outer Waves (Blue/Cyan) -->
  <rect x="12" y="1" width="3" height="3" fill="#3498db" opacity="0.8" />
  <rect x="8" y="2" width="2" height="2" fill="#3498db" opacity="0.6" />
  <rect x="7" y="3" width="2" height="2" fill="#2980b9" opacity="0.5" />
  <rect x="6" y="4" width="2" height="2" fill="#2980b9" opacity="0.4" />
  <rect x="5" y="5" width="2" height="2" fill="#2980b9" opacity="0.3" />
