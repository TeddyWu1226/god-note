<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="100%" height="100%" shape-rendering="crispEdges">
  <!-- Active Skill Border -->
  <rect x="0.5" y="0.5" width="15" height="15" fill="none" stroke="#3d3d4e" stroke-width="1" rx="0.5" ry="0.5" />

  <!-- Sword Blade Diagonal -->
  <rect x="4" y="11" width="1" height="1" fill="#7f8c8d" />
  <rect x="5" y="10" width="1" height="1" fill="#7f8c8d" />
  <rect x="6" y="9" width="1" height="1" fill="#bdc3c7" />
  <rect x="7" y="8" width="1" height="1" fill="#bdc3c7" />
  <rect x="8" y="7" width="1" height="1" fill="#ecf0f1" />
  <rect x="9" y="6" width="1" height="1" fill="#ffffff" />
  <rect x="10" y="5" width="1" height="1" fill="#ffffff" />

  <!-- Guard/Hilt -->
  <rect x="3" y="12" width="2" height="1" fill="#f1c40f" />
  <rect x="2" y="13" width="1" height="1" fill="#7e5109" />

  <!-- Polish Stone (Whetstone) rubbing the blade -->
  <rect x="7" y="5" width="3" height="2" fill="#566573" />
  <rect x="8" y="4" width="1" height="1" fill="#7f8c8d" />

  <!-- Sparkles/Polish shine (Yellow/White stars) -->
  <rect x="11" y="4" width="1" height="1" fill="#f1c40f" />
  <rect x="9" y="8" width="1" height="1" fill="#ffffff" />
  <rect x="6" y="7" width="1" height="1" fill="#f1c40f" />
  <rect x="8" y="9" width="1" height="1" fill="#ffffff" />
</svg>
