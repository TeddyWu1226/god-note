<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="100%" height="100%" shape-rendering="crispEdges">
  <!-- Retro Item Frame -->
  <rect x="0.5" y="0.5" width="15" height="15" fill="none" stroke="#3d3d4e" stroke-width="1" rx="0.5" ry="0.5" />

  <!-- Greatsword diagonal -->
  <!-- Hilt / Guard -->
  <rect x="3" y="12" width="1" height="1" fill="#795548" />
  <rect x="4" y="11" width="1" height="1" fill="#d35400" />
  <rect x="3" y="10" width="3" height="2" fill="#f1c40f" />

  <!-- Blade (Thicker and glowing red/gold) -->
  <rect x="5" y="9" width="2" height="2" fill="#c0392b" />
  <rect x="6" y="8" width="2" height="2" fill="#e74c3c" />
  <rect x="7" y="7" width="2" height="2" fill="#e74c3c" />
  <rect x="8" y="6" width="2" height="2" fill="#f1c40f" />
  <rect x="9" y="5" width="2" height="2" fill="#f1c40f" />
  <rect x="10" y="4" width="2" height="2" fill="#ffffff" />
  <rect x="11" y="3" width="2" height="2" fill="#ffffff" />
  <rect x="12" y="2" width="1" height="1" fill="#ffffff" />

  <!-- Heavy vertical slash impact/glow -->
  <rect x="7" y="1" width="2" height="12" fill="#ffffff" opacity="0.8" />
  <rect x="6" y="2" width="4" height="10" fill="#f39c12" opacity="0.6" />
  <rect x="5" y="3" width="6" height="8" fill="#e67e22" opacity="0.4" />
</svg>
