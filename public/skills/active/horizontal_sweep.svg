<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="100%" height="100%" shape-rendering="crispEdges">
    <rect x="0.5" y="0.5" width="15" height="15" fill="none" stroke="#3d3d4e" stroke-width="1" rx="0.5" ry="0.5" />
    <!-- Circular Whirlwind Slash Trail -->
    <!-- Center blade pivot -->
    <rect x="7" y="7" width="2" height="2" fill="#bdc3c7"/>

    <!-- Spinning Wind/Blade Circle -->
    <!-- Outer circle core (White) -->
    <rect x="5" y="2" width="6" height="1" fill="#ffffff"/>
    <rect x="2" y="5" width="1" height="6" fill="#ffffff"/>
    <rect x="13" y="5" width="1" height="6" fill="#ffffff"/>
    <rect x="5" y="13" width="6" height="1" fill="#ffffff"/>

    <!-- Outer circle highlights (Cyan) -->
    <rect x="4" y="3" width="1" height="1" fill="#3498db"/>
    <rect x="11" y="3" width="1" height="1" fill="#3498db"/>
    <rect x="3" y="4" width="1" height="1" fill="#3498db"/>
    <rect x="12" y="4" width="1" height="1" fill="#3498db"/>
    <rect x="3" y="11" width="1" height="1" fill="#3498db"/>
    <rect x="12" y="11" width="1" height="1" fill="#3498db"/>
    <rect x="4" y="12" width="1" height="1" fill="#3498db"/>
    <rect x="11" y="12" width="1" height="1" fill="#3498db"/>

    <!-- Whirlwind Spin Trails -->
    <rect x="6" y="4" width="4" height="1" fill="#5dade2"/>
    <rect x="4" y="6" width="1" height="4" fill="#5dade2"/>
    <rect x="11" y="6" width="1" height="4" fill="#5dade2"/>
    <rect x="6" y="11" width="4" height="1" fill="#5dade2"/>
</svg>
