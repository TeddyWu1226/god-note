<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="100%" height="100%" shape-rendering="crispEdges">
  <!-- Shadow/Dark smoke from behind (Dark Purple / Black) -->
  <rect x="1" y="6" width="8" height="8" fill="#1b1220" />
  <rect x="2" y="7" width="6" height="6" fill="#301934" />
  <rect x="0" y="8" width="10" height="4" fill="#301934" opacity="0.5" />

  <!-- Dagger slashing forward from shadow (Diagonal from top-left to bottom-right) -->
  <!-- Blade (Silver/Purple-tinged) -->
  <rect x="6" y="5" width="2" height="2" fill="#5b2c6f" />
  <rect x="8" y="7" width="2" height="2" fill="#a569bd" />
  <rect x="10" y="9" width="2" height="2" fill="#ffffff" />
  <rect x="12" y="11" width="1" height="1" fill="#ffffff" />
  
  <!-- Hilt/Guard -->
  <rect x="4" y="3" width="2" height="2" fill="#d4ac0d" />
  <rect x="3" y="2" width="1" height="1" fill="#78281f" />

  <!-- Spark trail of the slash -->
  <rect x="12" y="8" width="2" height="1" fill="#d2b4de" />
  <rect x="9" y="12" width="1" height="2" fill="#d2b4de" />
  <rect x="14" y="10" width="1" height="1" fill="#884ea0" />
</svg>
