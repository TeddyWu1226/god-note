<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="100%" height="100%" shape-rendering="crispEdges">
  <!-- Slashed Core Line (Vertical) -->
  <rect x="7" y="1" width="2" height="14" fill="#ffffff" />
  <!-- Side Glow (Yellow) -->
  <rect x="6" y="2" width="1" height="12" fill="#f1c40f" />
  <rect x="9" y="2" width="1" height="12" fill="#f1c40f" />
  <!-- Outer Glow (Orange) -->
  <rect x="5" y="4" width="1" height="8" fill="#e67e22" />
  <rect x="10" y="4" width="1" height="8" fill="#e67e22" />

  <!-- Sword Slicing Down (Diagonal to vertical) -->
  <rect x="7" y="1" width="2" height="6" fill="#ecf0f1" />
  <rect x="8" y="1" width="1" height="6" fill="#ffffff" />
  <rect x="7" y="0" width="1" height="1" fill="#ffffff" />
  
  <!-- Hilt / Guard -->
  <rect x="6" y="7" width="4" height="1" fill="#7f8c8d" />
  <rect x="8" y="8" width="1" height="2" fill="#3e2723" />
  <rect x="8" y="10" width="1" height="1" fill="#f1c40f" />
  
  <!-- Sparks -->
  <rect x="5" y="11" width="1" height="1" fill="#e67e22" />
  <rect x="10" y="11" width="1" height="1" fill="#e67e22" />
  <rect x="6" y="13" width="1" height="1" fill="#f1c40f" />
  <rect x="9" y="13" width="1" height="1" fill="#f1c40f" />
</svg>
