<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="100%" height="100%" shape-rendering="crispEdges">
  <!-- The Sword (diagonal from bottom-left to top-right) -->
  <!-- Hilt / Pommel -->
  <rect x="3" y="12" width="1" height="1" fill="#d35400" />
  <rect x="4" y="11" width="1" height="1" fill="#c0392b" />

  <!-- Hand Guard -->
  <rect x="3" y="10" width="1" height="1" fill="#f1c40f" />
  <rect x="4" y="10" width="1" height="1" fill="#f1c40f" />
  <rect x="5" y="10" width="1" height="1" fill="#f1c40f" />
  <rect x="5" y="11" width="1" height="1" fill="#f1c40f" />

  <!-- Blade (Silver & Gray highlight) -->
  <rect x="5" y="9" width="1" height="1" fill="#7f8c8d" />
  <rect x="6" y="9" width="1" height="1" fill="#ecf0f1" />

  <rect x="6" y="8" width="1" height="1" fill="#7f8c8d" />
  <rect x="7" y="8" width="1" height="1" fill="#ecf0f1" />

  <rect x="7" y="7" width="1" height="1" fill="#7f8c8d" />
  <rect x="8" y="7" width="1" height="1" fill="#ecf0f1" />

  <rect x="8" y="6" width="1" height="1" fill="#bdc3c7" />
  <rect x="9" y="6" width="1" height="1" fill="#ffffff" />

  <rect x="9" y="5" width="1" height="1" fill="#bdc3c7" />
  <rect x="10" y="5" width="1" height="1" fill="#ffffff" />

  <rect x="10" y="4" width="1" height="1" fill="#bdc3c7" />
  <rect x="11" y="4" width="1" height="1" fill="#ffffff" />

  <!-- Tip of Blade -->
  <rect x="11" y="3" width="1" height="1" fill="#ffffff" />

  <!-- Vertical Slash Effect (slicing down the column 8 and 9) -->
  <!-- Top glow -->
  <rect x="8" y="2" width="1" height="1" fill="#f1c40f" />
  <!-- Core trail -->
  <rect x="8" y="4" width="1" height="6" fill="#ffffff" />
  <rect x="9" y="4" width="1" height="6" fill="#f39c12" />
  <rect x="7" y="5" width="1" height="4" fill="#f1c40f" />
  <!-- Bottom glow/impact -->
  <rect x="8" y="3" width="2" height="1" fill="#d35400" />
  <rect x="8" y="10" width="1" height="1" fill="#f1c40f" />
  <rect x="9" y="10" width="1" height="1" fill="#f39c12" />
  <rect x="8" y="11" width="2" height="1" fill="#d35400" />
  <rect x="8" y="12" width="2" height="1" fill="#d35400" />
</svg>
