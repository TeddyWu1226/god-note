<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="100%" height="100%" shape-rendering="crispEdges">
  <!-- ================= HEAVY REINFORCED SHIELD ================= -->
  <!-- Shield Outline (Dark Bronze / Black-Brown) -->
  <rect x="4" y="2" width="8" height="1" fill="#3e2723" />
  <rect x="3" y="3" width="10" height="9" fill="#3e2723" />
  <rect x="4" y="12" width="8" height="1" fill="#3e2723" />
  <rect x="5" y="13" width="6" height="1" fill="#3e2723" />
  <rect x="7" y="14" width="2" height="1" fill="#3e2723" />

  <!-- Shield Core Steel Fill -->
  <rect x="4" y="4" width="8" height="8" fill="#7f8c8d" />
  <rect x="5" y="3" width="6" height="1" fill="#7f8c8d" />
  <rect x="5" y="12" width="6" height="1" fill="#7f8c8d" />
  <rect x="6" y="13" width="4" height="1" fill="#7f8c8d" />

  <!-- Left Steel Highlights (Light Silver) -->
  <rect x="4" y="3" width="1" height="9" fill="#bdc3c7" />
  <rect x="5" y="3" width="1" height="10" fill="#bdc3c7" />
  <rect x="6" y="4" width="1" height="9" fill="#bdc3c7" />

  <!-- Right Steel Shadows (Deep Slate Grey) -->
  <rect x="10" y="3" width="1" height="10" fill="#34495e" />
  <rect x="11" y="3" width="1" height="9" fill="#34495e" />

  <!-- ================= GOLDEN REINFORCEMENT BANDS (CROSS) ================= -->
  <!-- Horizontal Gold Band -->
  <rect x="4" y="6" width="8" height="2" fill="#d3d0d1" /> <!-- Gold Shadow -->
  <rect x="4" y="6" width="8" height="1" fill="#f1c40f" /> <!-- Gold Bright -->
  <rect x="5" y="6" width="2" height="1" fill="#fff9c4" /> <!-- Highlight -->

  <!-- Vertical Gold Band -->
  <rect x="7" y="3" width="2" height="10" fill="#d3d0d1" /> <!-- Gold Shadow -->
  <rect x="7" y="3" width="1" height="10" fill="#f1c40f" /> <!-- Gold Bright -->
  <rect x="7" y="4" width="1" height="2" fill="#fff9c4" /> <!-- Highlight -->

  <!-- Center Shield Gem (Glow Diamond) -->
  <rect x="7" y="6" width="2" height="2" fill="#ffffff" />
  <rect x="7" y="5" width="2" height="1" fill="#fff9c4" />
  <rect x="7" y="8" width="2" height="1" fill="#e67e22" />
  <rect x="6" y="6" width="1" height="2" fill="#fff9c4" />
  <rect x="9" y="6" width="1" height="2" fill="#e67e22" />
</svg>
