  <rect x="3" y="12" width="1" height="1" fill="#ff9800" />
  <rect x="12" y="12" width="1" height="1" fill="#ff9800" />

  <!-- Symmetrical Fist / Muscle Motif -->
  <!-- Dark Outline -->
  <rect x="5" y="3" width="2" height="1" fill="#4a0e17" />
  <rect x="9" y="3" width="2" height="1" fill="#4a0e17" />
