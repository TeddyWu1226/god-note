  <rect x="11" y="4" width="1" height="4" fill="#4a0e17" />
  <rect x="7" y="4" width="2" height="4" fill="#4a0e17" /> <!-- Center fissure/shadow -->
  <rect x="3" y="8" width="1" height="2" fill="#4a0e17" />
  <rect x="12" y="8" width="1" height="2" fill="#4a0e17" />
  <rect x="4" y="10" width="1" height="4" fill="#4a0e17" />
  <rect x="11" y="10" width="1" height="4" fill="#4a0e17" />
  <rect x="5" y="14" width="6" height="1" fill="#4a0e17" />

  <!-- Main Body (Red) -->
  <rect x="5" y="4" width="2" height="4" fill="#c62828" />
  <rect x="9" y="4" width="2" height="4" fill="#c62828" />
  <rect x="4" y="8" width="8" height="2" fill="#c62828" />
  <rect x="5" y="10" width="6" height="4" fill="#c62828" />

