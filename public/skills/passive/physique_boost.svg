  <rect x="6" y="2" width="4" height="1" fill="#ff9800" />
  <rect x="2" y="5" width="1" height="1" fill="#ff9800" />
  <rect x="13" y="5" width="1" height="1" fill="#ff9800" />
  <rect x="1" y="9" width="1" height="1" fill="#e65100" />
