  <!-- Core Glow (Orange/Yellow) -->
  <rect x="7" y="6" width="2" height="2" fill="#ffeb3b" />
  <rect x="6" y="7" width="4" height="2" fill="#ff9800" />
  <rect x="7" y="9" width="2" height="2" fill="#ff9800" />
