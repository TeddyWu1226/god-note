<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="100%" height="100%" shape-rendering="crispEdges">
  <!-- Diagonal Piercing Sword (Bottom-left to top-right) -->
  <!-- Hilt -->
  <rect x="1" y="14" width="1" height="1" fill="#3e2723" />
  <rect x="2" y="13" width="1" height="1" fill="#3e2723" />
  <!-- Guard -->
  <rect x="2" y="12" width="2" height="1" fill="#bdc3c7" />
  <rect x="3" y="13" width="1" height="1" fill="#bdc3c7" />

  <!-- Blade (Silver & white highlights) -->
  <rect x="4" y="11" width="1" height="1" fill="#95a5a6" />
  <rect x="5" y="10" width="1" height="1" fill="#95a5a6" />
  <rect x="6" y="9" width="1" height="1" fill="#bdc3c7" />
  <rect x="7" y="8" width="1" height="1" fill="#bdc3c7" />
  <rect x="8" y="7" width="1" height="1" fill="#ecf0f1" />
  <rect x="9" y="6" width="1" height="1" fill="#ffffff" />
  <rect x="10" y="5" width="1" height="1" fill="#ffffff" />

  <!-- Piercing Impact Point (Sharp Spark) -->
  <rect x="10" y="4" width="2" height="2" fill="#9b59b6" /> <!-- Violet glow -->
  <rect x="11" y="3" width="2" height="2" fill="#ffffff" /> <!-- White core piercing spark -->
  <rect x="9" y="3" width="1" height="1" fill="#8e44ad" />
  <rect x="13" y="5" width="1" height="1" fill="#8e44ad" />
  <rect x="12" y="2" width="1" height="1" fill="#9b59b6" />
  <rect x="8" y="6" width="1" height="1" fill="#9b59b6" />
</svg>
