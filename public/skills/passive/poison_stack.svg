<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="100%" height="100%" shape-rendering="crispEdges">
  <!-- Overlapping double daggers coated in toxic green slime -->
  <!-- Dagger 1 -->
  <rect x="6" y="4" width="2" height="2" fill="#2ecc71" />
  <rect x="8" y="6" width="2" height="2" fill="#ffffff" />
  <rect x="10" y="8" width="2" height="2" fill="#2ecc71" />
  <rect x="12" y="10" width="1" height="1" fill="#2ecc71" />
  <rect x="3" y="1" width="2" height="2" fill="#f1c40f" />

  <!-- Dagger 2 (Offset) -->
  <rect x="8" y="6" width="2" height="2" fill="#27ae60" />
  <rect x="10" y="8" width="2" height="2" fill="#ffffff" />
  <rect x="12" y="10" width="2" height="2" fill="#27ae60" />
  <rect x="14" y="12" width="1" height="1" fill="#27ae60" />
  <rect x="5" y="3" width="2" height="2" fill="#f1c40f" />

  <!-- Dripping slime stacks -->
  <rect x="14" y="13" width="1" height="2" fill="#2ecc71" />
  <rect x="12" y="11" width="1" height="2" fill="#2ecc71" />
  <rect x="9" y="9" width="1" height="1" fill="#a569bd" /> <!-- Violet fumes -->
  <rect x="11" y="7" width="1" height="1" fill="#a569bd" />
</svg>
