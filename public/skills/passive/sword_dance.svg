<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="100%" height="100%" shape-rendering="crispEdges">
  <!-- Double dancing blades crossing gracefully -->
  <!-- Blade 1 (Left slant, pink/violet outline/trail) -->
  <rect x="3" y="12" width="1" height="1" fill="#884ea0" />
  <rect x="4" y="10" width="1" height="2" fill="#a569bd" />
  <rect x="5" y="8" width="1" height="2" fill="#bb8fce" />
  <rect x="6" y="6" width="1" height="2" fill="#d2b4de" />
  <rect x="7" y="4" width="1" height="2" fill="#ffffff" />
  <rect x="8" y="3" width="1" height="1" fill="#ffffff" />

  <!-- Blade 2 (Right slant, cyan/blue outline/trail) -->
  <rect x="12" y="12" width="1" height="1" fill="#2471a3" />
  <rect x="11" y="10" width="1" height="2" fill="#3498db" />
  <rect x="10" y="8" width="1" height="2" fill="#5dade2" />
  <rect x="9" y="6" width="1" height="2" fill="#85c1e9" />
  <rect x="8" y="4" width="1" height="2" fill="#ffffff" />
  <rect x="7" y="3" width="1" height="1" fill="#ffffff" />

  <!-- Dance swirl energy lines -->
  <rect x="2" y="9" width="1" height="1" fill="#d2b4de" opacity="0.6" />
  <rect x="13" y="9" width="1" height="1" fill="#85c1e9" opacity="0.6" />
  <rect x="4" y="5" width="2" height="1" fill="#f5eef8" />
  <rect x="10" y="5" width="2" height="1" fill="#ebf5fb" />
</svg>
