<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="100%" height="100%" shape-rendering="crispEdges">
  <!-- Borderless Background for Passive Skill -->
  <rect width="16" height="16" fill="#1b1c20" rx="1" ry="1" />

  <!-- Blue Plate / Skin Texture (Shield shape in Blue) -->
  <rect x="5" y="3" width="6" height="1" fill="#1b4f72" />
  <rect x="4" y="4" width="8" height="1" fill="#2980b9" />
  <rect x="3" y="5" width="10" height="4" fill="#2980b9" />
  <rect x="4" y="9" width="8" height="2" fill="#1f618d" />
  <rect x="5" y="11" width="6" height="1" fill="#1f618d" />
  <rect x="6" y="12" width="4" height="1" fill="#154360" />
  <rect x="7" y="13" width="2" height="1" fill="#154360" />

  <!-- Skin Texture Highlights (Light Blue) -->
  <rect x="5" y="4" width="2" height="1" fill="#3498db" />
  <rect x="4" y="5" width="2" height="2" fill="#3498db" />
  <rect x="10" y="5" width="2" height="2" fill="#2471a3" /> <!-- Shadow -->

  <!-- Cyan/Blue Mana Star (Auto-regen SP symbol) -->
  <rect x="7" y="5" width="2" height="6" fill="#00ffff" />
  <rect x="5" y="7" width="6" height="2" fill="#00ffff" />
  <rect x="7" y="7" width="2" height="2" fill="#ffffff" /> <!-- center highlight -->
</svg>
