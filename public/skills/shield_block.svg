<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="100%" height="100%" shape-rendering="crispEdges">
  <!-- Retro Item Frame (Border Only, Transparent Background) -->
  <rect x="0.5" y="0.5" width="15" height="15" fill="none" stroke="#3d3d4e" stroke-width="1" rx="0.5" ry="0.5" />

  <!-- Shield Outline (Steel Blue) -->
  <rect x="4" y="3" width="8" height="1" fill="#2c3e50" />
  <rect x="3" y="4" width="10" height="8" fill="#2c3e50" />
  <rect x="4" y="12" width="8" height="1" fill="#2c3e50" />
  <rect x="5" y="13" width="6" height="1" fill="#2c3e50" />
  <rect x="7" y="14" width="2" height="1" fill="#2c3e50" />

  <!-- Inner Plate (Slate/Gray) -->
  <rect x="4" y="5" width="8" height="7" fill="#7f8c8d" />
  <rect x="5" y="4" width="6" height="1" fill="#7f8c8d" />
  <rect x="5" y="12" width="6" height="1" fill="#7f8c8d" />
  <rect x="6" y="13" width="4" height="1" fill="#7f8c8d" />

  <!-- Bevel / Light Steel Highlight -->
  <rect x="4" y="4" width="1" height="8" fill="#bdc3c7" />
  <rect x="5" y="4" width="6" height="1" fill="#bdc3c7" />
  <rect x="11" y="5" width="1" height="7" fill="#34495e" />

  <!-- Gold Cross Pattern in Center -->
  <rect x="7" y="5" width="2" height="7" fill="#f1c40f" />
  <rect x="5" y="7" width="6" height="2" fill="#f1c40f" />
  
  <!-- Cross Highlights & Shadows -->
  <rect x="7" y="7" width="2" height="2" fill="#ffffff" />
  <rect x="7" y="9" width="2" height="1" fill="#d35400" />
  <rect x="10" y="7" width="1" height="2" fill="#d35400" />
</svg>
