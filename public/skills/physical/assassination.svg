<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="100%" height="100%" shape-rendering="crispEdges">
  <!-- Retro Item Frame -->
  <rect x="0.5" y="0.5" width="15" height="15" fill="none" stroke="#3d3d4e" stroke-width="1" rx="0.5" ry="0.5" />

  <!-- Dark Shadowy background representing stealth -->
  <rect x="5" y="5" width="6" height="6" fill="#120524" opacity="0.65" />
  <rect x="4" y="6" width="8" height="4" fill="#120524" opacity="0.4" />
  <rect x="6" y="4" width="4" height="8" fill="#120524" opacity="0.4" />

  <!-- Dagger Blade (Metal edge with white highlights) -->
  <rect x="4" y="10" width="1" height="1" fill="#ffffff" /> <!-- Tip of the blade -->
  <rect x="5" y="9" width="1" height="1" fill="#ffffff" />
  <rect x="6" y="8" width="1" height="1" fill="#ecf0f1" />
  <rect x="7" y="7" width="1" height="1" fill="#bdc3c7" />
  <rect x="8" y="6" width="1" height="1" fill="#95a5a6" />
  <rect x="9" y="5" width="1" height="1" fill="#7f8c8d" />

  <!-- Venom/Poison coating (Glowing green edge) -->
  <rect x="3" y="10" width="1" height="1" fill="#2ecc71" />
  <rect x="4" y="9" width="1" height="1" fill="#2ecc71" />
  <rect x="5" y="8" width="1" height="1" fill="#27ae60" />
  <rect x="6" y="7" width="1" height="1" fill="#27ae60" />
  <rect x="7" y="6" width="1" height="1" fill="#1e824c" />
  <rect x="2" y="11" width="1" height="1" fill="#2ecc71" /> <!-- Poison drip -->
  <rect x="2" y="12" width="1" height="2" fill="#2ecc71" opacity="0.8" />

  <!-- Crimson bloody trail / Shadow strike -->
  <rect x="5" y="11" width="1" height="1" fill="#ff1e56" />
  <rect x="6" y="10" width="1" height="1" fill="#ff1e56" />
  <rect x="7" y="9" width="1" height="1" fill="#d81b60" />
  <rect x="8" y="8" width="1" height="1" fill="#880e4f" />

  <!-- Crossguard (Dark gold/amber) -->
  <rect x="8" y="4" width="1" height="1" fill="#d35400" />
  <rect x="9" y="4" width="1" height="1" fill="#f39c12" />
  <rect x="10" y="4" width="1" height="1" fill="#f1c40f" />
  <rect x="10" y="5" width="1" height="1" fill="#f39c12" />
  <rect x="10" y="6" width="1" height="1" fill="#d35400" />

  <!-- Handle/Grip (Brown leather wrap) -->
  <rect x="11" y="3" width="1" height="1" fill="#795548" />
  <rect x="12" y="2" width="1" height="1" fill="#5d4037" />
  <rect x="13" y="1" width="1" height="1" fill="#3e2723" />



  <!-- Critical hit slash line overlay (Intersecting diagonal) -->
  <rect x="1" y="6" width="1" height="1" fill="#ff1e56" />
  <rect x="2" y="7" width="1" height="1" fill="#ff1e56" />
  <rect x="3" y="8" width="1" height="1" fill="#ff1e56" />
  <rect x="4" y="9" width="1" height="1" fill="#ffffff" /> <!-- Highlight cross point -->
  <rect x="5" y="10" width="1" height="1" fill="#ff1e56" />
  <rect x="6" y="11" width="1" height="1" fill="#ff1e56" />
  <rect x="7" y="12" width="1" height="1" fill="#ff1e56" />
  <rect x="8" y="13" width="1" height="1" fill="#ff1e56" />
  <rect x="9" y="14" width="1" height="1" fill="#ff1e56" />
</svg>
