<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="100%" height="100%" shape-rendering="crispEdges">
  <!-- Shield body (brown, angled slightly) -->
  <rect x="2" y="2" width="6" height="1" fill="#4d3626" />
  <rect x="1" y="3" width="7" height="1" fill="#4d3626" />
  <rect x="1" y="4" width="7" height="1" fill="#4d3626" />
  
  <!-- Shield main body plate -->
  <rect x="2" y="3" width="5" height="1" fill="#8d6e63" />
  <rect x="2" y="4" width="6" height="5" fill="#8d6e63" />
  <rect x="2" y="9" width="5" height="1" fill="#5d4037" />
  <rect x="3" y="10" width="4" height="1" fill="#5d4037" />
  <rect x="4" y="11" width="2" height="1" fill="#3e2723" />
  
  <!-- Left metal trim -->
  <rect x="1" y="4" width="1" height="7" fill="#4e342e" />
  <rect x="2" y="11" width="2" height="1" fill="#4e342e" />
  <rect x="3" y="12" width="1" height="1" fill="#3e2723" />

  <!-- Orange/Yellow center flash -->
  <rect x="4" y="5" width="2" height="3" fill="#ffb74d" />
  <rect x="3" y="6" width="4" height="1" fill="#ffa726" />
  <rect x="5" y="6" width="1" height="1" fill="#ffffff" /> <!-- center spark -->
  
  <!-- White bouncing arrow (Strikes at x=5,y=6 and bounces off towards bottom-right) -->
  <!-- Outline -->
  <rect x="9" y="3" width="2" height="2" fill="#212121" />
  <rect x="8" y="4" width="2" height="2" fill="#212121" />
  <rect x="7" y="5" width="2" height="2" fill="#212121" />
  
  <!-- Bounce corner outline -->
  <rect x="6" y="6" width="3" height="3" fill="#212121" />
  
  <!-- Outgoing path outline -->
  <rect x="8" y="8" width="2" height="2" fill="#212121" />
  <rect x="9" y="9" width="2" height="2" fill="#212121" />
  
  <!-- Arrow Head outline -->
  <rect x="10" y="10" width="4" height="4" fill="#212121" />

  <!-- White inner arrow fill -->
  <rect x="10" y="3" width="1" height="1" fill="#ffffff" />
  <rect x="9" y="4" width="1" height="1" fill="#ffffff" />
  <rect x="8" y="5" width="1" height="1" fill="#ffffff" />
  <rect x="7" y="6" width="2" height="1" fill="#ffffff" />
  <rect x="7" y="7" width="1" height="1" fill="#ffffff" />
  
  <rect x="8" y="8" width="1" height="1" fill="#ffffff" />
  <rect x="9" y="9" width="1" height="1" fill="#ffffff" />
  
  <!-- Arrow Head white fill -->
  <rect x="11" y="10" width="2" height="2" fill="#ffffff" />
  <rect x="10" y="11" width="3" height="1" fill="#ffffff" />
  <rect x="12" y="12" width="1" height="1" fill="#ffffff" />
</svg>
