<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="100%" height="100%" shape-rendering="crispEdges">
  <!-- Active Skill Border -->
  <rect x="0.5" y="0.5" width="15" height="15" fill="none" stroke="#3d3d4e" stroke-width="1" rx="0.5" ry="0.5" />

  <!-- Magic Sphere Inner Glow (Cyan-blue) -->
  <path d="M 6 2 H 10 V 3 H 12 V 4 H 13 V 12 H 12 V 13 H 10 V 14 H 6 V 13 H 4 V 12 H 3 V 4 H 4 V 3 H 6 Z" fill="#2ecc71" opacity="0.1" />
  <path d="M 6 3 H 10 V 4 H 11 V 5 H 12 V 11 H 11 V 12 H 10 V 13 H 6 V 12 H 5 V 11 H 4 V 5 H 5 V 4 H 6 Z" fill="#3498db" opacity="0.2" />

  <!-- Person Silhouette (Centered, with light yellow/mana color) -->
  <!-- Head -->
  <rect x="7" y="5" width="2" height="2" fill="#ecf0f1" />
  <!-- Body/Torso -->
  <rect x="6" y="7" width="4" height="4" fill="#bdc3c7" />
  <!-- Arms -->
  <rect x="5" y="8" width="1" height="2" fill="#95a5a6" />
  <rect x="10" y="8" width="1" height="2" fill="#95a5a6" />
  <!-- Legs -->
  <rect x="6" y="11" width="1" height="2" fill="#95a5a6" />
  <rect x="9" y="11" width="1" height="2" fill="#95a5a6" />

  <!-- Outer Sphere Barrier (Cyan / Green blend) -->
  <rect x="6" y="2" width="4" height="1" fill="#1abc9c" />
  <rect x="4" y="3" width="2" height="1" fill="#1abc9c" />
  <rect x="10" y="3" width="2" height="1" fill="#1abc9c" />
  <rect x="3" y="4" width="1" height="8" fill="#3498db" />
  <rect x="12" y="4" width="1" height="8" fill="#3498db" />
  <rect x="4" y="12" width="2" height="1" fill="#1abc9c" />
  <rect x="10" y="12" width="2" height="1" fill="#1abc9c" />
  <rect x="6" y="13" width="4" height="1" fill="#1abc9c" />

  <!-- Sphere Highlights & Inner Nodes -->
  <rect x="5" y="3" width="1" height="1" fill="#ffffff" />
  <rect x="4" y="4" width="1" height="1" fill="#ffffff" />
  <rect x="3" y="5" width="1" height="1" fill="#ffffff" />
  
  <rect x="11" y="3" width="1" height="1" fill="#2ecc71" />
  <rect x="12" y="4" width="1" height="1" fill="#2ecc71" />
  
  <!-- Glowing bottom highlight -->
  <rect x="11" y="11" width="1" height="1" fill="#ffffff" />
  <rect x="12" y="10" width="1" height="1" fill="#2ecc71" />
  <rect x="3" y="10" width="1" height="1" fill="#2ecc71" />

  <!-- Sparkle details -->
  <rect x="1" y="7" width="1" height="1" fill="#5adeff" />
  <rect x="14" y="7" width="1" height="1" fill="#5adeff" />
</svg>
