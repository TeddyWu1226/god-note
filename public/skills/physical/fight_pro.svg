<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="100%" height="100%" shape-rendering="crispEdges">
  <!-- Sword blade (vertical in center) -->
  <rect x="8" y="2" width="1" height="9" fill="#ffffff" />
  <rect x="7" y="3" width="1" height="8" fill="#bdc3c7" />
  <rect x="9" y="3" width="1" height="8" fill="#7f8c8d" />

  <!-- Guard -->
  <rect x="6" y="11" width="5" height="1" fill="#f1c40f" />
  <rect x="8" y="10" width="1" height="2" fill="#d35400" />

  <!-- Hilt/pommel -->
  <rect x="8" y="12" width="1" height="2" fill="#8B4513" />
  <rect x="8" y="14" width="1" height="1" fill="#f1c40f" />

  <!-- Flames surrounding the blade -->
  <rect x="5" y="6" width="1" height="3" fill="#e74c3c" />
  <rect x="6" y="4" width="1" height="4" fill="#ff3f34" />
  <rect x="6" y="5" width="1" height="1" fill="#ff7675" />
  <rect x="11" y="6" width="1" height="3" fill="#e74c3c" />
  <rect x="10" y="4" width="1" height="4" fill="#ff3f34" />
  <rect x="10" y="5" width="1" height="1" fill="#ff7675" />
  <rect x="7" y="1" width="3" height="1" fill="#ff3f34" />
</svg>
