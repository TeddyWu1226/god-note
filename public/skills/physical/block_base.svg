<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="100%" height="100%" shape-rendering="crispEdges">
  <!-- Outer Outline (Dark Wood / Bronze Rim) -->
  <rect x="5" y="2" width="6" height="1" fill="#3e2723" />
  <rect x="4" y="3" width="8" height="1" fill="#3e2723" />
  <rect x="3" y="4" width="10" height="8" fill="#3e2723" />
  <rect x="4" y="12" width="8" height="1" fill="#3e2723" />
  <rect x="5" y="13" width="6" height="1" fill="#3e2723" />

  <!-- Wooden Shield Body (Brown Fill) -->
  <rect x="5" y="4" width="6" height="8" fill="#8d6e63" />
  <rect x="4" y="5" width="8" height="6" fill="#8d6e63" />
  
  <!-- Wood Plank Lines (Dark Wood Shadows) -->
  <rect x="7" y="3" width="1" height="10" fill="#5d4037" />
  <rect x="9" y="4" width="1" height="8" fill="#5d4037" />
  <rect x="5" y="8" width="6" height="1" fill="#5d4037" />

  <!-- Bronze/Copper Rim Highlights -->
  <rect x="5" y="3" width="6" height="1" fill="#bcaaa4" />
  <rect x="4" y="4" width="1" height="8" fill="#bcaaa4" />
  <rect x="11" y="4" width="1" height="8" fill="#5d4037" />
  <rect x="5" y="12" width="6" height="1" fill="#5d4037" />

  <!-- Center Steel Stud/Boss (Silver Shield Core) -->
  <rect x="7" y="7" width="2" height="2" fill="#bdc3c7" />
  <rect x="7" y="6" width="2" height="1" fill="#ecf0f1" />
  <rect x="6" y="7" width="1" height="2" fill="#ecf0f1" />
  <rect x="7" y="8" width="2" height="1" fill="#7f8c8d" />
  <rect x="9" y="7" width="1" height="2" fill="#7f8c8d" />
</svg>
