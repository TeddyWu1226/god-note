<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="100%" height="100%" shape-rendering="crispEdges">
    <!-- Wooden shaft with metal reinforcement -->
    <rect x="2" y="13" width="1" height="1" fill="#8B4513"/>
    <rect x="3" y="11" width="1" height="2" fill="#8B4513"/>
    <rect x="5" y="6" width="1" height="1" fill="#A0522D"/>
    <rect x="4" y="8" width="1" height="3" fill="#8B4513"/>
    <rect x="4" y="8" width="1" height="2" fill="#7f8fa6"/>


    <!-- Steel Axe Head -->
    <rect x="5" y="7" width="1" height="4" fill="#7f8fa6"/>
    <rect x="6" y="7" width="1" height="5" fill="#718093"/>
    <rect x="7" y="7" width="1" height="5" fill="#dcdde1"/>
    <rect x="8" y="8" width="1" height="3" fill="#ffffff"/>

    <!--  特效-->
    <rect x="9" y="5" width="1" height="1" fill="#ffffff"/>
    <rect x="9" y="4" width="1" height="1" fill="#f1c40f"/>
    <rect x="9" y="6" width="1" height="1" fill="#f1c40f"/>
    <rect x="8" y="5" width="1" height="1" fill="#f1c40f"/>
    <rect x="10" y="5" width="1" height="1" fill="#f1c40f"/>

    <!-- Radiant Cross Star 2 (Left of blade) -->
    <rect x="3" y="6" width="1" height="1" fill="#ffffff"/>
    <rect x="3" y="5" width="1" height="1" fill="#f1c40f"/>
    <rect x="3" y="7" width="1" height="1" fill="#f1c40f"/>
    <rect x="2" y="6" width="1" height="1" fill="#f1c40f"/>
    <rect x="4" y="6" width="1" height="1" fill="#f1c40f"/>

    <!-- Radiant Cross Star 3 (Bottom-right of guard) -->
    <rect x="8" y="13" width="1" height="1" fill="#ffffff"/>
    <rect x="8" y="12" width="1" height="1" fill="#f1c40f"/>
    <rect x="8" y="14" width="1" height="1" fill="#f1c40f"/>
    <rect x="7" y="13" width="1" height="1" fill="#f1c40f"/>
    <rect x="9" y="13" width="1" height="1" fill="#f1c40f"/>

    <!-- Additional glowing sparkles -->
    <rect x="10" y="8" width="1" height="1" fill="#f1c40f"/>
    <rect x="8" y="5" width="1" height="1" fill="#f1c40f"/>
    <rect x="3" y="5" width="1" height="1" fill="#f1c40f"/>
    <rect x="1" y="10" width="1" height="1" fill="#f1c40f"/>
</svg>
