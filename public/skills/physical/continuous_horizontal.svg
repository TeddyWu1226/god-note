<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="100%" height="100%" shape-rendering="crispEdges">
  <!-- Horizontal Slash Line (White core) -->
  <rect x="1" y="7" width="14" height="2" fill="#ffffff" />
  <!-- Upper Glow (Cyan) -->
  <rect x="2" y="6" width="12" height="1" fill="#3498db" />
  <rect x="4" y="5" width="8" height="1" fill="#5dade2" />
  <!-- Lower Glow (Teal/Dark Blue) -->
  <rect x="2" y="9" width="12" height="1" fill="#1b4f72" />
  <rect x="4" y="10" width="8" height="1" fill="#154360" />

  <!-- Sword slashing from left to right -->
  <!-- Guard -->
  <rect x="2" y="6" width="1" height="4" fill="#bdc3c7" />
  <!-- Hilt -->
  <rect x="1" y="7" width="1" height="2" fill="#3e2723" />
  <!-- Blade start -->
  <rect x="3" y="7" width="3" height="2" fill="#ffffff" />
  
  <!-- Spark droplets -->
  <rect x="14" y="6" width="1" height="1" fill="#3498db" />
  <rect x="13" y="9" width="1" height="1" fill="#3498db" />
</svg>
