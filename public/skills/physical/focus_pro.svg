<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="100%" height="100%" shape-rendering="crispEdges">
  <rect x="0.5" y="0.5" width="15" height="15" fill="none" stroke="#3d3d4e" stroke-width="1" rx="0.5" ry="0.5" />
  <!-- Eye outline (Blue/Cyan scan style) -->
  <rect x="2" y="7" width="2" height="1" fill="#00d2d3" />
  <rect x="11" y="7" width="2" height="1" fill="#00d2d3" />
  <rect x="4" y="5" width="7" height="1" fill="#00d2d3" />
  <rect x="4" y="9" width="7" height="1" fill="#00d2d3" />
  <rect x="3" y="6" width="1" height="3" fill="#00a8ff" />
  <rect x="11" y="6" width="1" height="3" fill="#00a8ff" />

  <!-- Pupil/Iris (Purple/Pink scanner) -->
  <rect x="6" y="6" width="3" height="3" fill="#e91e63" />
  <rect x="7" y="7" width="1" height="1" fill="#ffffff" /> <!-- highlight -->

  <!-- Scanline (horizontal red laser) -->
  <rect x="1" y="7" width="13" height="1" fill="#ff7675" />
</svg>
