<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="100%" height="100%" shape-rendering="crispEdges">
    <!-- Vertical shaft/handle -->
    <rect x="8" y="3" width="1" height="10" fill="#8B4513"/>
    <rect x="8" y="2" width="1" height="1" fill="#7f8fa6"/> <!-- top cap -->


    <!-- Hand 1 (Lower Hand) wrapping the shaft -->
    <rect x="7" y="9" width="3" height="1" fill="#ffd394"/>
    <rect x="7" y="10" width="2" height="1" fill="#eccc68"/> <!-- shading -->

    <!-- Hand 2 (Upper Hand) wrapping the shaft -->
    <rect x="7" y="6" width="3" height="1" fill="#ffd394"/>
    <rect x="8" y="5" width="2" height="1" fill="#eccc68"/> <!-- shading -->
</svg>
