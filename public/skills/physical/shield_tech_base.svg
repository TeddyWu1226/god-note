<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="100%" height="100%" shape-rendering="crispEdges">
  <!-- Active Skill Border -->
  <rect x="0.5" y="0.5" width="15" height="15" fill="none" stroke="#3d3d4e" stroke-width="1" rx="0.5" ry="0.5" />

  <!-- Magic Sphere Glow Fill (Semi-transparent cyan/blue background inside sphere) -->
  <path d="M 6 2 H 10 V 3 H 12 V 4 H 13 V 12 H 12 V 13 H 10 V 14 H 6 V 13 H 4 V 12 H 3 V 4 H 4 V 3 H 6 Z" fill="#3498db" opacity="0.15" />

  <!-- Person Silhouette (Centered inside the bubble) -->
  <!-- Head -->
  <rect x="7" y="5" width="2" height="2" fill="#bdc3c7" />
  <!-- Body/Torso -->
  <rect x="6" y="7" width="4" height="4" fill="#95a5a6" />
  <!-- Arms -->
  <rect x="5" y="8" width="1" height="2" fill="#7f8c8d" />
  <rect x="10" y="8" width="1" height="2" fill="#7f8c8d" />
  <!-- Legs -->
  <rect x="6" y="11" width="1" height="2" fill="#7f8c8d" />
  <rect x="9" y="11" width="1" height="2" fill="#7f8c8d" />

  <!-- Magic Sphere Barrier Outline (Soft blue) -->
  <rect x="6" y="2" width="4" height="1" fill="#3498db" />
  <rect x="4" y="3" width="2" height="1" fill="#3498db" />
  <rect x="10" y="3" width="2" height="1" fill="#3498db" />
  <rect x="3" y="4" width="1" height="8" fill="#3498db" />
  <rect x="12" y="4" width="1" height="8" fill="#3498db" />
  <rect x="4" y="12" width="2" height="1" fill="#3498db" />
  <rect x="10" y="12" width="2" height="1" fill="#3498db" />
  <rect x="6" y="13" width="4" height="1" fill="#3498db" />

  <!-- Sphere Highlight reflection (White spark) -->
  <rect x="5" y="3" width="1" height="1" fill="#ffffff" />
  <rect x="4" y="4" width="1" height="1" fill="#ffffff" />
  <rect x="11" y="11" width="1" height="1" fill="#5adeff" />
</svg>
