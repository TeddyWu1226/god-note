<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="100%" height="100%" shape-rendering="crispEdges">
  <rect x="0.5" y="0.5" width="15" height="15" fill="none" stroke="#3d3d4e" stroke-width="1" rx="0.5" ry="0.5" />

  <!-- Shield with crack -->
  <rect x="8" y="5" width="5" height="6" fill="#718093" />
  <!-- Crack lines -->
  <rect x="10" y="5" width="1" height="2" fill="#2f3542" />
  <rect x="9" y="7" width="1" height="2" fill="#2f3542" />
  <rect x="10" y="9" width="1" height="2" fill="#2f3542" />

  <!-- Striking axe -->
  <rect x="3" y="10" width="2" height="3" fill="#8B4513" />
  <rect x="4" y="8" width="2" height="2" fill="#8B4513" />
  <rect x="5" y="6" width="3" height="3" fill="#dcdde1" />
  <rect x="7" y="5" width="2" height="2" fill="#718093" />
</svg>
