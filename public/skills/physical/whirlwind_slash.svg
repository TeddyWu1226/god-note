<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="100%" height="100%" shape-rendering="crispEdges">
    <rect x="0.5" y="0.5" width="15" height="15" fill="none" stroke="#3d3d4e" stroke-width="1" rx="0.5" ry="0.5" />

    <!-- Dynamic Circular Sweep/Slash Trail (Spinning Motion) -->
    <!-- Outer Ring Glow -->
    <rect x="5" y="2" width="6" height="1" fill="#3498db" />
    <rect x="3" y="4" width="10" height="1" fill="#3498db" />
    <rect x="2" y="5" width="1" height="6" fill="#3498db" />
    <rect x="13" y="5" width="1" height="6" fill="#3498db" />
    <rect x="3" y="11" width="10" height="1" fill="#3498db" />
    <rect x="5" y="13" width="6" height="1" fill="#3498db" />

    <!-- Inner Bright Trail (Crescent Swirl - White Core) -->
    <rect x="6" y="3" width="5" height="1" fill="#ffffff" />
    <rect x="11" y="4" width="2" height="1" fill="#ffffff" />
    <rect x="12" y="5" width="1" height="3" fill="#ffffff" />
    <rect x="11" y="8" width="2" height="1" fill="#ffffff" />
    <rect x="7" y="9" width="4" height="1" fill="#ffffff" />
    <rect x="5" y="8" width="2" height="1" fill="#ffffff" />
    <rect x="4" y="6" width="1" height="2" fill="#ffffff" />

    <!-- Sword Hilt & Pivot in the Center (Dynamic Swing) -->
    <rect x="7" y="7" width="2" height="2" fill="#bdc3c7" />
    <rect x="6" y="8" width="1" height="1" fill="#3e2723" />
    <rect x="8" y="6" width="1" height="1" fill="#3e2723" />

    <!-- Sweep Blur & Sparks (Teal) -->
    <rect x="4" y="3" width="1" height="1" fill="#5dade2" />
    <rect x="12" y="3" width="1" height="1" fill="#5dade2" />
    <rect x="13" y="4" width="1" height="1" fill="#5dade2" />
    <rect x="14" y="8" width="1" height="1" fill="#5dade2" />
    <rect x="11" y="10" width="1" height="1" fill="#5dade2" />
    <rect x="4" y="11" width="1" height="1" fill="#5dade2" />
    <rect x="2" y="7" width="1" height="1" fill="#5dade2" />
</svg>