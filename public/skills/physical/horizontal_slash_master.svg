<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="100%" height="100%" shape-rendering="crispEdges">
  <!-- Retro Item Frame -->
  <rect x="0.5" y="0.5" width="15" height="15" fill="none" stroke="#3d3d4e" stroke-width="1" rx="0.5" ry="0.5" />

  <!-- Diagonal Sword Hilt and Blade -->
  <rect x="2" y="11" width="1" height="1" fill="#795548" />
  <rect x="3" y="10" width="2" height="2" fill="#d35400" />
  <rect x="4" y="9" width="1" height="1" fill="#7f8c8d" />
  <rect x="5" y="8" width="1" height="1" fill="#bdc3c7" />
  <rect x="6" y="7" width="1" height="1" fill="#ffffff" />

  <!-- Massive Horizontal Slash Trails (Double/Triple Line cuts) -->
  <!-- Top line -->
  <rect x="2" y="4" width="12" height="1" fill="#e74c3c" />
  <rect x="4" y="3" width="8" height="1" fill="#f1c40f" />
  
  <!-- Middle line (Dominant slash) -->
  <rect x="1" y="7" width="14" height="2" fill="#ffffff" />
  <rect x="3" y="7" width="10" height="2" fill="#f39c12" />
  <rect x="5" y="6" width="6" height="4" fill="#e67e22" opacity="0.5" />

  <!-- Bottom line -->
  <rect x="2" y="11" width="12" height="1" fill="#e74c3c" />
  <rect x="4" y="12" width="8" height="1" fill="#f1c40f" />
</svg>
