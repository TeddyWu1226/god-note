<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="100%" height="100%" shape-rendering="crispEdges">
  <rect x="0.5" y="0.5" width="15" height="15" fill="none" stroke="#3d3d4e" stroke-width="1" rx="0.5" ry="0.5" />
  <!-- Spinning motion blur circle -->
  <circle cx="8" cy="8" r="5" fill="none" stroke="#718093" stroke-width="1.5" stroke-dasharray="4, 3" />
  <circle cx="8" cy="8" r="6" fill="none" stroke="#dcdde1" stroke-width="1" stroke-dasharray="6, 2" />

  <!-- Diagonal axe in the center -->
  <rect x="6" y="8" width="4" height="2" fill="#8B4513" transform="rotate(45 8 8)" />
  <rect x="9" y="5" width="3" height="3" fill="#718093" transform="rotate(45 8 8)" />
</svg>
