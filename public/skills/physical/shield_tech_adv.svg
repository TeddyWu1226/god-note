<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="100%" height="100%" shape-rendering="crispEdges">
  <!-- Active Skill Border -->
  <rect x="0.5" y="0.5" width="15" height="15" fill="none" stroke="#3d3d4e" stroke-width="1" rx="0.5" ry="0.5" />

  <!-- Magic Sphere Golden Inner Shield Fill -->
  <path d="M 6 2 H 10 V 3 H 12 V 4 H 13 V 12 H 12 V 13 H 10 V 14 H 6 V 13 H 4 V 12 H 3 V 4 H 4 V 3 H 6 Z" fill="#2ecc71" opacity="0.15" />
  <path d="M 6 3 H 10 V 4 H 11 V 5 H 12 V 11 H 11 V 12 H 10 V 13 H 6 V 12 H 5 V 11 H 4 V 5 H 5 V 4 H 6 Z" fill="#f1c40f" opacity="0.15" />

  <!-- Person Silhouette (Golden Glowing Figure) -->
  <!-- Head -->
  <rect x="7" y="5" width="2" height="2" fill="#f1c40f" />
  <!-- Body/Torso -->
  <rect x="6" y="7" width="4" height="4" fill="#f39c12" />
  <!-- Arms -->
  <rect x="5" y="8" width="1" height="2" fill="#f1c40f" />
  <rect x="10" y="8" width="1" height="2" fill="#f1c40f" />
  <!-- Legs -->
  <rect x="6" y="11" width="1" height="2" fill="#f39c12" />
  <rect x="9" y="11" width="1" height="2" fill="#f39c12" />

