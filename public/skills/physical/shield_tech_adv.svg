  <rect x="5" y="3" width="1" height="1" fill="#ffffff" />
  <rect x="4" y="4" width="1" height="1" fill="#ffffff" />
  <rect x="11" y="3" width="1" height="1" fill="#ffffff" />
  <rect x="12" y="4" width="1" height="1" fill="#ffffff" />
  
  <rect x="4" y="11" width="1" height="1" fill="#5adeff" />
  <rect x="11" y="11" width="1" height="1" fill="#5adeff" />

  <!-- Extra Radial Energy Rays (Corner magic sparkles) -->
  <rect x="1" y="2" width="1" height="1" fill="#2ecc71" />
  <rect x="14" y="2" width="1" height="1" fill="#f1c40f" />
  <rect x="1" y="13" width="1" height="1" fill="#f1c40f" />
  <rect x="14" y="13" width="1" height="1" fill="#2ecc71" />
