  <rect x="6" y="2" width="4" height="1" fill="#2ecc71" />
  <rect x="4" y="3" width="2" height="1" fill="#2ecc71" />
  <rect x="10" y="3" width="2" height="1" fill="#2ecc71" />
  <rect x="3" y="4" width="1" height="8" fill="#27ae60" />
  <rect x="12" y="4" width="1" height="8" fill="#27ae60" />
  <rect x="4" y="12" width="2" height="1" fill="#2ecc71" />
  <rect x="10" y="12" width="2" height="1" fill="#2ecc71" />
  <rect x="6" y="13" width="4" height="1" fill="#2ecc71" />

  <!-- Glowing White Runes / Arc Overlays -->
  <rect x="7" y="2" width="2" height="1" fill="#ffffff" />
  <rect x="7" y="13" width="2" height="1" fill="#ffffff" />
  <rect x="3" y="7" width="1" height="2" fill="#ffffff" />
  <rect x="12" y="7" width="1" height="2" fill="#ffffff" />

