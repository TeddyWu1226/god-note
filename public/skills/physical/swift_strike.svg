<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="100%" height="100%" shape-rendering="crispEdges">
  <!-- Retro Item Frame -->
  <rect x="0.5" y="0.5" width="15" height="15" fill="none" stroke="#3d3d4e" stroke-width="1" rx="0.5" ry="0.5" />

  <!-- Swift Motion Trail (Cyan & Light Blue Wind Lines) -->
  <rect x="1" y="13" width="1" height="1" fill="#00ffff" />
  <rect x="2" y="11" width="1" height="1" fill="#81ecec" />
  <rect x="3" y="12" width="2" height="1" fill="#00ffff" opacity="0.6" />
  <rect x="3" y="9" width="1" height="1" fill="#00ffff" />
  <rect x="4" y="10" width="1" height="1" fill="#81ecec" />
  
  <rect x="4" y="7" width="2" height="1" fill="#00ffff" />
  <rect x="5" y="8" width="1" height="1" fill="#ffffff" />
  
  <rect x="6" y="5" width="2" height="1" fill="#81ecec" />
  <rect x="7" y="6" width="1" height="1" fill="#ffffff" />

  <rect x="8" y="4" width="2" height="1" fill="#00ffff" />
  <rect x="9" y="3" width="2" height="1" fill="#00ffff" />
  <rect x="10" y="2" width="2" height="1" fill="#00ffff" />
  <rect x="11" y="1" width="2" height="1" fill="#00ffff" />

  <!-- Dagger Pommel & Handle -->
  <rect x="2" y="13" width="1" height="1" fill="#5d4037" />
  <rect x="3" y="12" width="1" height="1" fill="#795548" />
  <rect x="4" y="11" width="1" height="1" fill="#5d4037" />
  
  <!-- Hand Guard (Gold) -->
  <rect x="3" y="10" width="1" height="1" fill="#f1c40f" />
  <rect x="4" y="10" width="1" height="1" fill="#f1c40f" />
  <rect x="5" y="10" width="1" height="1" fill="#f1c40f" />
  <rect x="5" y="11" width="1" height="1" fill="#f1c40f" />

  <!-- Dagger Blade (Silver & Highlights) -->
  <rect x="5" y="9" width="1" height="1" fill="#7f8c8d" />
  <rect x="6" y="9" width="1" height="1" fill="#ecf0f1" />
  
  <rect x="6" y="8" width="1" height="1" fill="#7f8c8d" />
  <rect x="7" y="8" width="1" height="1" fill="#ecf0f1" />
  
  <rect x="7" y="7" width="1" height="1" fill="#bdc3c7" />
  <rect x="8" y="7" width="1" height="1" fill="#ffffff" />
  
  <!-- Blade Tip -->
  <rect x="8" y="6" width="1" height="1" fill="#ffffff" />
  
  <!-- Impact Sparks at Tip -->
  <rect x="9" y="5" width="1" height="1" fill="#00ffff" />
  <rect x="10" y="6" width="1" height="1" fill="#ffffff" />
</svg>
