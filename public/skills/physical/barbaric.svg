<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="100%" height="100%" shape-rendering="crispEdges">
  <!-- Active Border -->
  <rect x="0.5" y="0.5" width="15" height="15" fill="none" stroke="#3d3d4e" stroke-width="1" rx="0.5" ry="0.5" />
  
  <!-- Red anger waves -->
  <path d="M 2,5 Q 5,1 8,5 T 14,5" fill="none" stroke="#e84118" stroke-width="1" />
  <path d="M 2,8 Q 5,4 8,8 T 14,8" fill="none" stroke="#c23616" stroke-width="1" />

  <!-- Screaming skull/face simple pixel representation -->
  <rect x="6" y="9" width="4" height="4" fill="#dcdde1" />
  <rect x="7" y="11" width="2" height="2" fill="#2f3542" />
  <rect x="6" y="10" width="1" height="1" fill="#2f3542" />
  <rect x="9" y="10" width="1" height="1" fill="#2f3542" />
</svg>
