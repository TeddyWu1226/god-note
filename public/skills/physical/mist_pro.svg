<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="100%" height="100%" shape-rendering="crispEdges">
  <!-- Active Skill Border -->
  <rect x="0.5" y="0.5" width="15" height="15" fill="none" stroke="#3d3d4e" stroke-width="1" rx="0.5" ry="0.5" />

  <!-- Toxic/Anesthetic green/purple mist clouds -->
  <rect x="2" y="4" width="4" height="2" fill="#7d6608" opacity="0.4" />
  <rect x="3" y="3" width="7" height="4" fill="#a569bd" opacity="0.6" />
  <rect x="8" y="7" width="5" height="3" fill="#58d68d" opacity="0.5" />
  <rect x="6" y="6" width="8" height="5" fill="#a569bd" opacity="0.7" />
  <rect x="1" y="9" width="6" height="4" fill="#58d68d" opacity="0.6" />

  <!-- Dagger hidden in toxic mist -->
  <rect x="3" y="11" width="2" height="2" fill="#7d6608" />
  <rect x="5" y="9" width="2" height="2" fill="#ffffff" />
  <!-- Sparkles -->
  <rect x="11" y="4" width="1" height="1" fill="#f1c40f" />
</svg>
