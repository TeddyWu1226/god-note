<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="100%" height="100%" shape-rendering="crispEdges">
  <!-- Retro Item Frame (Border Only, Transparent Background) -->
  <rect x="0.5" y="0.5" width="15" height="15" fill="none" stroke="#3d3d4e" stroke-width="1" rx="0.5" ry="0.5" />

  <!-- ================= ARM & WRIST (Metallic Gauntlet) ================= -->
  <!-- Outline -->
  <rect x="5" y="11" width="1" height="4" fill="#2c3e50" />
  <rect x="10" y="11" width="1" height="4" fill="#2c3e50" />
  <!-- Fill -->
  <rect x="6" y="11" width="1" height="4" fill="#bdc3c7" />
  <rect x="7" y="11" width="2" height="4" fill="#7f8c8d" />
  <rect x="9" y="11" width="1" height="4" fill="#34495e" />

  <!-- ================= FIST (Clenched Gauntlet) ================= -->
  <!-- Hand Side Outlines -->
  <rect x="4" y="6" width="1" height="5" fill="#2c3e50" />
  <rect x="11" y="6" width="1" height="5" fill="#2c3e50" />
  <!-- Top Knuckle Outline -->
  <rect x="5" y="4" width="6" height="1" fill="#2c3e50" />

  <!-- Knuckles (Highlight Row) -->
  <rect x="5" y="5" width="6" height="1" fill="#bdc3c7" />
  <rect x="6" y="5" width="1" height="1" fill="#ffffff" /> <!-- Index Knuckle Highlight -->
  <rect x="8" y="5" width="1" height="1" fill="#ffffff" /> <!-- Middle Knuckle Highlight -->

  <!-- Clenched Fingers (y=6..8) -->
  <!-- Index finger -->
  <rect x="5" y="6" width="1" height="3" fill="#bdc3c7" />
  <!-- Divider -->
  <rect x="6" y="6" width="1" height="3" fill="#2c3e50" />
  <!-- Middle finger -->
  <rect x="7" y="6" width="1" height="3" fill="#bdc3c7" />
  <!-- Divider -->
  <rect x="8" y="6" width="1" height="3" fill="#2c3e50" />
  <!-- Ring finger -->
  <rect x="9" y="6" width="1" height="3" fill="#7f8c8d" />
  <!-- Pinky finger -->
  <rect x="10" y="6" width="1" height="3" fill="#34495e" />

  <!-- Thumb (Folded over index & middle finger at the bottom) -->
  <rect x="3" y="7" width="1" height="2" fill="#2c3e50" />
  <rect x="4" y="7" width="1" height="2" fill="#bdc3c7" />
  <rect x="4" y="9" width="4" height="1" fill="#bdc3c7" />
  <rect x="4" y="10" width="4" height="1" fill="#2c3e50" />
  <rect x="8" y="9" width="1" height="1" fill="#2c3e50" />

  <!-- ================= POWER-UP / EMPOWERMENT ENERGY FLARES ================= -->
  <!-- Top Upward Flares (Fiery red & gold) -->
  <rect x="7" y="2" width="2" height="1" fill="#ffffff" />
  <rect x="7" y="3" width="2" height="1" fill="#f1c40f" />
  <rect x="6" y="2" width="1" height="2" fill="#e74c3c" />
  <rect x="9" y="2" width="1" height="2" fill="#e74c3c" />
  <rect x="5" y="2" width="1" height="1" fill="#f1c40f" />
  <rect x="10" y="2" width="1" height="1" fill="#f1c40f" />

  <!-- Side Energy Radiance (Buff feeling) -->
  <rect x="2" y="7" width="1" height="2" fill="#e67e22" />
  <rect x="13" y="7" width="1" height="2" fill="#e67e22" />
  <rect x="2" y="5" width="1" height="1" fill="#f1c40f" />
  <rect x="13" y="5" width="1" height="1" fill="#f1c40f" />
  <rect x="1" y="6" width="1" height="1" fill="#e74c3c" />
  <rect x="14" y="6" width="1" height="1" fill="#e74c3c" />
  <rect x="3" y="4" width="1" height="1" fill="#e67e22" />
  <rect x="12" y="4" width="1" height="1" fill="#e67e22" />
  
  <!-- Sparks in corners -->
  <rect x="13" y="12" width="1" height="1" fill="#f1c40f" />
  <rect x="2" y="12" width="1" height="1" fill="#f1c40f" />
  <rect x="12" y="14" width="1" height="1" fill="#e74c3c" />
  <rect x="3" y="14" width="1" height="1" fill="#e74c3c" />
</svg>
