<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="100%" height="100%" shape-rendering="crispEdges">
    <!-- Vertical shaft/handle -->
    <rect x="5" y="3" width="1" height="10" fill="#8B4513"/>
    <rect x="5" y="2" width="1" height="1" fill="#7f8fa6"/> <!-- top cap -->


    <!-- Hand 1 (Lower Hand) wrapping the shaft -->
    <rect x="3" y="9" width="3" height="1" fill="#ffd394"/>
    <rect x="4" y="10" width="2" height="1" fill="#eccc68"/> <!-- shading -->

    <!-- Hand 2 (Upper Hand) wrapping the shaft -->
    <rect x="4" y="6" width="3" height="1" fill="#ffd394"/>
    <rect x="4" y="5" width="2" height="1" fill="#eccc68"/> <!-- shading -->

    <!--  特效-->
    <rect x="9" y="5" width="1" height="1" fill="#ffffff"/>
    <rect x="9" y="4" width="1" height="1" fill="#2ecc71"/>
    <rect x="9" y="6" width="1" height="1" fill="#00ffff"/>
    <rect x="8" y="5" width="1" height="1" fill="#2ecc71"/>
    <rect x="10" y="5" width="1" height="1" fill="#00ffff"/>

    <!-- Radiant Cross Star 2 (Left of blade) -->
    <rect x="1" y="6" width="1" height="1" fill="#ffffff"/>
    <rect x="1" y="5" width="1" height="1" fill="#ff7675"/>
    <rect x="1" y="7" width="1" height="1" fill="#f1c40f"/>
    <rect x="0" y="6" width="1" height="1" fill="#ff7675"/>
    <rect x="2" y="6" width="1" height="1" fill="#f1c40f"/>

    <!-- Radiant Cross Star 3 (Bottom-right of guard) -->
    <rect x="8" y="11" width="1" height="1" fill="#ffffff"/>
    <rect x="8" y="10" width="1" height="1" fill="#e67e22"/>
    <rect x="8" y="12" width="1" height="1" fill="#be2edd"/>
    <rect x="7" y="11" width="1" height="1" fill="#e67e22"/>
    <rect x="9" y="11" width="1" height="1" fill="#be2edd"/>

    <!--    &lt;!&ndash; Mastery Sparks (Golden - Scattered around the short blade) &ndash;&gt;-->
    <rect x="7" y="8" width="1" height="1" fill="#2ecc71"/>
    <rect x="1" y="10" width="1" height="1" fill="#be2edd"/>
    <rect x="3" y="4" width="1" height="1" fill="#e67e22"/>
</svg>
