<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="100%" height="100%" shape-rendering="crispEdges">
  <!-- Boot body (brown and dark brown) -->
  <rect x="4" y="6" width="3" height="5" fill="#8B4513" />
  <rect x="3" y="10" width="5" height="2" fill="#8B4513" />
  <rect x="2" y="11" width="7" height="2" fill="#5c2c16" /> <!-- Sole -->
  <rect x="4" y="5" width="3" height="1" fill="#cd6133" /> <!-- Boot cuff -->

  <!-- Wings (White and Cyan highlights) -->
  <rect x="7" y="3" width="2" height="2" fill="#ffffff" />
  <rect x="9" y="2" width="2" height="2" fill="#ffffff" />
  <rect x="11" y="1" width="3" height="1" fill="#ffffff" />

  <rect x="8" y="5" width="2" height="2" fill="#bdc3c7" />
  <rect x="10" y="4" width="2" height="2" fill="#bdc3c7" />
  <rect x="12" y="3" width="2" height="1" fill="#bdc3c7" />

  <rect x="8" y="7" width="2" height="1" fill="#00d2d3" /> <!-- wing feather bottom (cyan) -->
  <rect x="10" y="6" width="2" height="1" fill="#00d2d3" />

  <!-- Laces (Yellow) -->
  <rect x="7" y="7" width="1" height="1" fill="#f1c40f" />
  <rect x="7" y="9" width="1" height="1" fill="#f1c40f" />
</svg>
