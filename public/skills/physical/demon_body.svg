<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="100%" height="100%" shape-rendering="crispEdges">
  <!-- Demon horns (top left/right) -->
  <rect x="3" y="1" width="2" height="2" fill="#4a154b" />
  <rect x="11" y="1" width="2" height="2" fill="#4a154b" />
  <rect x="4" y="2" width="1" height="2" fill="#c62828" /> <!-- Horn highlight red -->
  <rect x="11" y="2" width="1" height="2" fill="#1565c0" /> <!-- Horn highlight blue -->

  <!-- Body / Shield Shape -->
  <rect x="5" y="3" width="6" height="1" fill="#4a154b" />
  <rect x="3" y="4" width="10" height="1" fill="#6c3483" />
  <rect x="2" y="5" width="12" height="4" fill="#8e44ad" />
  <rect x="3" y="9" width="10" height="2" fill="#7d3c98" />
  <rect x="4" y="11" width="8" height="1" fill="#7d3c98" />
  <rect x="5" y="12" width="6" height="1" fill="#5b2c6f" />
  <rect x="6" y="13" width="4" height="1" fill="#4a154b" />
  <rect x="7" y="14" width="2" height="1" fill="#4a154b" />

  <!-- Eyes (glowing) -->
  <rect x="4" y="6" width="2" height="1" fill="#ff5252" /> <!-- Left red eye -->
  <rect x="10" y="6" width="2" height="1" fill="#448aff" /> <!-- Right blue eye -->

  <!-- Center Core / Energy Loop (combination of Blood and Mana: Purple/Magenta glow) -->
  <rect x="7" y="5" width="2" height="6" fill="#e040fb" />
  <rect x="5" y="7" width="6" height="2" fill="#e040fb" />
  <rect x="7" y="7" width="2" height="2" fill="#ffffff" /> <!-- center highlight -->
</svg>
