<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="100%" height="100%" shape-rendering="crispEdges">
  <!-- Active Skill Border -->
  <rect x="0.5" y="0.5" width="15" height="15" fill="none" stroke="#3d3d4e" stroke-width="1" rx="0.5" ry="0.5" />

  <!-- Gray/White dynamic mist clouds -->
  <rect x="2" y="4" width="4" height="2" fill="#d5dbdb" />
  <rect x="3" y="3" width="6" height="4" fill="#eaeded" opacity="0.8" />
  <rect x="8" y="7" width="5" height="3" fill="#d5dbdb" />
  <rect x="7" y="6" width="7" height="5" fill="#eaeded" opacity="0.8" />
  <rect x="1" y="9" width="6" height="4" fill="#bdc3c7" opacity="0.6" />
  
  <!-- Dagger tip hidden in mist (Diagonal from bottom-left) -->
  <rect x="3" y="11" width="2" height="2" fill="#7f8c8d" />
  <rect x="5" y="9" width="2" height="2" fill="#ffffff" />
</svg>
