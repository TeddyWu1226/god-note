<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="100%" height="100%" shape-rendering="crispEdges">
  <!-- Rock/Mountain Background (Slashed) -->
  <rect x="1" y="8" width="5" height="7" fill="#555" />
  <rect x="2" y="6" width="3" height="2" fill="#555" />
  <rect x="10" y="8" width="5" height="7" fill="#555" />
  <rect x="11" y="6" width="3" height="2" fill="#555" />
  
  <!-- Left Rock Shading/Shadow -->
  <rect x="1" y="9" width="4" height="6" fill="#333" />
  <!-- Right Rock Shading/Highlight -->
  <rect x="12" y="8" width="3" height="7" fill="#777" />
  <rect x="11" y="7" width="2" height="1" fill="#777" />

  <!-- Slashed Gap (Glow center) -->
  <rect x="6" y="2" width="4" height="14" fill="#e74c3c" opacity="0.3" />

  <!-- Vertical Sword (劈山 - Blazing Golden Sword slicing down) -->
  <!-- Blade -->
  <rect x="7" y="1" width="2" height="9" fill="#f1c40f" />
  <rect x="8" y="1" width="1" height="9" fill="#ffffff" />
  <rect x="7" y="0" width="1" height="1" fill="#ffffff" />

  <!-- Guard -->
  <rect x="6" y="10" width="4" height="1" fill="#e67e22" />

  <!-- Hilt -->
  <rect x="8" y="11" width="1" height="2" fill="#78281f" />
  <rect x="8" y="13" width="1" height="1" fill="#f1c40f" />

  <!-- Slice Impact Sparks (Orange and Yellow) -->
  <rect x="5" y="8" width="1" height="2" fill="#f39c12" />
  <rect x="10" y="8" width="1" height="2" fill="#f39c12" />
  <rect x="6" y="5" width="1" height="1" fill="#f1c40f" />
  <rect x="9" y="5" width="1" height="1" fill="#f1c40f" />
  <rect x="5" y="11" width="1" height="1" fill="#e74c3c" />
  <rect x="10" y="11" width="1" height="1" fill="#e74c3c" />
</svg>
