<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="100%" height="100%" shape-rendering="crispEdges">
    <!-- Plume (Red) -->
    <!-- Row 1 -->
    <rect x="8" y="1" width="1" height="1" fill="#9a0007"/>
    <rect x="9" y="1" width="1" height="1" fill="#d32f2f"/>
    <!-- Row 2 -->
    <rect x="7" y="2" width="1" height="1" fill="#d32f2f"/>
    <rect x="8" y="2" width="2" height="1" fill="#ef5350"/>
    <rect x="10" y="2" width="1" height="1" fill="#d32f2f"/>
    <rect x="11" y="2" width="1" height="1" fill="#9a0007"/>
    <!-- Row 3 -->
    <rect x="8" y="3" width="1" height="1" fill="#9a0007"/>
    <rect x="9" y="3" width="3" height="1" fill="#d32f2f"/>
    <rect x="12" y="3" width="1" height="1" fill="#9a0007"/>
    <!-- Row 4 -->
    <rect x="10" y="4" width="1" height="1" fill="#9a0007"/>
    <rect x="11" y="4" width="1" height="1" fill="#d32f2f"/>
    <rect x="12" y="4" width="1" height="1" fill="#9a0007"/>

    <!-- Helmet Dome -->
    <!-- Row 4 -->
    <rect x="5" y="4" width="1" height="1" fill="#78909c"/>
    <rect x="6" y="4" width="2" height="1" fill="#cfd8dc"/>
    <rect x="8" y="4" width="1" height="1" fill="#78909c"/>
    <rect x="9" y="4" width="1" height="1" fill="#37474f"/>
    <!-- Row 5 -->
    <rect x="4" y="5" width="1" height="1" fill="#78909c"/>
    <rect x="5" y="5" width="1" height="1" fill="#cfd8dc"/>
    <rect x="6" y="5" width="1" height="1" fill="#ffffff"/>
    <rect x="7" y="5" width="1" height="1" fill="#cfd8dc"/>
    <rect x="8" y="5" width="1" height="1" fill="#78909c"/>
    <rect x="9" y="5" width="2" height="1" fill="#37474f"/>

    <!-- Visor (Facing Left) -->
    <!-- Row 6 (Visor top and hinge) -->
    <rect x="3" y="6" width="2" height="1" fill="#cfd8dc"/>
    <rect x="5" y="6" width="3" height="1" fill="#ffca28"/> <!-- Golden visor brow -->
    <rect x="8" y="6" width="1" height="1" fill="#78909c"/>
    <rect x="9" y="6" width="2" height="1" fill="#37474f"/>
    <!-- Row 7 (Eye slit / Dark visor gap) -->
    <rect x="3" y="7" width="1" height="1" fill="#78909c"/>
    <rect x="4" y="7" width="1" height="1" fill="#ff8f00"/>
    <rect x="5" y="7" width="2" height="1" fill="#1a1a1a"/> <!-- Eye slit -->
    <rect x="7" y="7" width="1" height="1" fill="#ff8f00"/>
    <rect x="8" y="7" width="1" height="1" fill="#78909c"/>
    <rect x="9" y="7" width="2" height="1" fill="#37474f"/>
    <!-- Row 8 (Visor bottom) -->
    <rect x="3" y="8" width="1" height="1" fill="#78909c"/>
    <rect x="4" y="8" width="1" height="1" fill="#cfd8dc"/>
    <rect x="5" y="8" width="3" height="1" fill="#ffca28"/> <!-- Golden visor chin -->
    <rect x="8" y="8" width="1" height="1" fill="#78909c"/>
    <rect x="9" y="8" width="2" height="1" fill="#37474f"/>

    <!-- Jaw & Neck Guard -->
    <!-- Row 9 -->
    <rect x="4" y="9" width="1" height="1" fill="#78909c"/>
    <rect x="5" y="9" width="1" height="1" fill="#cfd8dc"/>
    <rect x="6" y="9" width="2" height="1" fill="#78909c"/>
    <rect x="8" y="9" width="3" height="1" fill="#37474f"/>
    <!-- Row 10 -->
    <rect x="5" y="10" width="2" height="1" fill="#78909c"/>
    <rect x="7" y="10" width="5" height="1" fill="#37474f"/>
    <!-- Row 11 -->
    <rect x="5" y="11" width="7" height="1" fill="#37474f"/>

    <!-- Shoulder / Gorget -->
    <!-- Row 12 -->
    <rect x="4" y="12" width="1" height="1" fill="#78909c"/>
    <rect x="5" y="12" width="2" height="1" fill="#cfd8dc"/>
    <rect x="7" y="12" width="1" height="1" fill="#78909c"/>
    <rect x="8" y="12" width="2" height="1" fill="#37474f"/>
    <!-- Row 13 -->
    <rect x="3" y="13" width="2" height="1" fill="#78909c"/>
    <rect x="5" y="13" width="1" height="1" fill="#cfd8dc"/>
    <rect x="6" y="13" width="1" height="1" fill="#78909c"/>
    <rect x="7" y="13" width="2" height="1" fill="#37474f"/>
</svg>
