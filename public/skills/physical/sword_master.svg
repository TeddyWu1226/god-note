  <!-- Top-Right Tip Sparkles (Cyan, White & Magenta) -->
  <rect x="13" y="2" width="1" height="1" fill="#ffffff" />
  <rect x="13" y="1" width="1" height="1" fill="#00ffff" />
  <rect x="13" y="3" width="1" height="1" fill="#be2edd" />
  <rect x="12" y="2" width="1" height="1" fill="#00ffff" />
  <rect x="14" y="2" width="1" height="1" fill="#be2edd" />
  <rect x="12" y="1" width="1" height="1" fill="#ffffff" />
  <rect x="14" y="3" width="1" height="1" fill="#00ffff" />

  <!-- Mid-Blade Left Sparkles (Orange, White & Gold) -->
  <rect x="3" y="6" width="1" height="1" fill="#ffffff" />
  <rect x="3" y="5" width="1" height="1" fill="#ff7675" />
  <rect x="3" y="7" width="1" height="1" fill="#f1c40f" />
  <rect x="2" y="6" width="1" height="1" fill="#ff7675" />
