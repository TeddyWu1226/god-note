  <rect x="11" y="1" width="1" height="1" fill="#ffffff" />
  <rect x="14" y="5" width="1" height="1" fill="#be2edd" />
  <rect x="1" y="8" width="1" height="1" fill="#f1c40f" />
  <rect x="13" y="10" width="1" height="1" fill="#2ecc71" />
  <rect x="10" y="13" width="1" height="1" fill="#e67e22" />
  <rect x="6" y="14" width="1" height="1" fill="#be2edd" />
