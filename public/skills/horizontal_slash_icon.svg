<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="100%" height="100%" shape-rendering="crispEdges">
  <!-- Retro Item Frame -->
  <rect width="16" height="16" fill="#121216" rx="1" ry="1" />
  <rect x="1" y="1" width="14" height="14" fill="#3d3d4e" />
  <rect x="2" y="2" width="12" height="12" fill="#1e1e24" />

  <!-- The Sword (diagonal from bottom-right to top-left) -->
  <!-- Hilt / Pommel -->
  <rect x="12" y="12" width="1" height="1" fill="#d35400" />
  <rect x="11" y="11" width="1" height="1" fill="#c0392b" />
  
  <!-- Hand Guard -->
  <rect x="10" y="10" width="3" height="1" fill="#f1c40f" />
  <rect x="11" y="9" width="1" height="1" fill="#f1c40f" />

  <!-- Blade (Silver & Gray highlight) -->
  <rect x="9" y="9" width="1" height="1" fill="#7f8c8d" />
  <rect x="8" y="9" width="1" height="1" fill="#ecf0f1" />
  
  <rect x="8" y="8" width="1" height="1" fill="#7f8c8d" />
  <rect x="7" y="8" width="1" height="1" fill="#ecf0f1" />
  
  <rect x="7" y="7" width="1" height="1" fill="#7f8c8d" />
  <rect x="6" y="7" width="1" height="1" fill="#ecf0f1" />
  
  <rect x="6" y="6" width="1" height="1" fill="#bdc3c7" />
  <rect x="5" y="6" width="1" height="1" fill="#ffffff" />
  
  <rect x="5" y="5" width="1" height="1" fill="#bdc3c7" />
  <rect x="4" y="5" width="1" height="1" fill="#ffffff" />
  
  <rect x="4" y="4" width="1" height="1" fill="#bdc3c7" />
  <rect x="3" y="4" width="1" height="1" fill="#ffffff" />

  <!-- Tip of Blade -->
  <rect x="3" y="3" width="1" height="1" fill="#ffffff" />

  <!-- Curved Horizontal Slash Arc Effect (sweeping left-to-right, curved) -->
  <!-- Underglow (Orange) -->
  <rect x="3" y="9" width="2" height="1" fill="#e67e22" />
  <rect x="5" y="8" width="2" height="1" fill="#e67e22" />
  <rect x="7" y="8" width="2" height="1" fill="#e67e22" />
  <rect x="9" y="8" width="2" height="1" fill="#e67e22" />
  <rect x="11" y="9" width="2" height="1" fill="#e67e22" />

  <!-- Core Slash (Yellow and White) -->
  <rect x="4" y="8" width="2" height="1" fill="#f1c40f" />
  <rect x="6" y="7" width="2" height="1" fill="#ffffff" />
  <rect x="8" y="7" width="2" height="1" fill="#ffffff" />
  <rect x="10" y="8" width="2" height="1" fill="#f1c40f" />

  <!-- Slash sparks -->
  <rect x="3" y="7" width="1" height="1" fill="#f39c12" />
  <rect x="12" y="8" width="1" height="1" fill="#f39c12" />
</svg>
