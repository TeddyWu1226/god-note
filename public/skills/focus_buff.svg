<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="100%" height="100%" shape-rendering="crispEdges">
  <rect x="0.5" y="0.5" width="15" height="15" fill="none" stroke="#3d3d4e" stroke-width="1" rx="0.5" ry="0.5" />
  <!-- Outer Red Ring -->
  <rect x="5" y="3" width="5" height="1" fill="#e74c3c" />
  <rect x="5" y="13" width="5" height="1" fill="#e74c3c" />
  <rect x="2" y="6" width="1" height="5" fill="#e74c3c" />
  <rect x="12" y="6" width="1" height="5" fill="#e74c3c" />
  
  <rect x="3" y="4" width="2" height="1" fill="#e74c3c" />
  <rect x="3" y="5" width="1" height="1" fill="#e74c3c" />
  
  <rect x="10" y="4" width="2" height="1" fill="#e74c3c" />
  <rect x="11" y="5" width="1" height="1" fill="#e74c3c" />
  
  <rect x="3" y="12" width="2" height="1" fill="#e74c3c" />
  <rect x="3" y="11" width="1" height="1" fill="#e74c3c" />
  
  <rect x="10" y="12" width="2" height="1" fill="#e74c3c" />
  <rect x="11" y="11" width="1" height="1" fill="#e74c3c" />

  <!-- Inner White Ring -->
  <rect x="5" y="5" width="5" height="1" fill="#ffffff" />
  <rect x="5" y="11" width="5" height="1" fill="#ffffff" />
  <rect x="4" y="6" width="1" height="5" fill="#ffffff" />
  <rect x="10" y="6" width="1" height="5" fill="#ffffff" />
  
  <rect x="4" y="5" width="1" height="1" fill="#ffffff" />
  <rect x="10" y="5" width="1" height="1" fill="#ffffff" />
  <rect x="4" y="11" width="1" height="1" fill="#ffffff" />
  <rect x="10" y="11" width="1" height="1" fill="#ffffff" />

  <!-- Center Red Bullseye (3x3 circle-ish) -->
  <rect x="6" y="6" width="3" height="1" fill="#c0392b" />
  <rect x="5" y="7" width="5" height="3" fill="#c0392b" />
  <rect x="6" y="10" width="3" height="1" fill="#c0392b" />
  
  <rect x="6" y="7" width="2" height="2" fill="#ff7675" /> <!-- Bullseye center highlight -->

  <!-- Arrow Shaft (diagonal from top-right to center) -->
  <rect x="10" y="5" width="1" height="1" fill="#795548" />
  <rect x="9" y="6" width="1" height="1" fill="#795548" />
  <rect x="8" y="7" width="1" height="1" fill="#795548" />
  
  <!-- Arrow Head (Silver) -->
  <rect x="7" y="8" width="1" height="1" fill="#95a5a6" />
  <rect x="6" y="9" width="1" height="1" fill="#7f8c8d" />

  <!-- Arrow Fletching / Feathers (Cyan/White) -->
  <rect x="12" y="3" width="1" height="1" fill="#3498db" />
  <rect x="11" y="4" width="1" height="1" fill="#3498db" />
  <rect x="13" y="2" width="1" height="1" fill="#ecf0f1" />
  <rect x="12" y="2" width="1" height="1" fill="#ecf0f1" />
  <rect x="13" y="3" width="1" height="1" fill="#ecf0f1" />
</svg>
