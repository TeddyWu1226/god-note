<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="100%" height="100%" shape-rendering="crispEdges">
  <rect x="0.5" y="0.5" width="15" height="15" fill="none" stroke="#3d3d4e" stroke-width="1" rx="0.5" ry="0.5" />
  
  <!-- Trail (Thick ice blast) -->
  <rect x="2" y="13" width="2" height="1" fill="#0984e3" />
  <rect x="3" y="12" width="2" height="2" fill="#74b9ff" />
  <rect x="4" y="11" width="2" height="2" fill="#74b9ff" />
  <rect x="5" y="10" width="2" height="2" fill="#74b9ff" />
  <rect x="6" y="9" width="3" height="2" fill="#00d2d3" />
  <rect x="7" y="8" width="3" height="2" fill="#00d2d3" />
  <rect x="8" y="7" width="3" height="2" fill="#afeeee" />
  
  <!-- Outer ice curls / smoke rings on trail -->
  <rect x="2" y="11" width="1" height="1" fill="#0984e3" />
  <rect x="4" y="13" width="1" height="1" fill="#0984e3" />
  <rect x="5" y="8" width="1" height="2" fill="#0984e3" />
  <rect x="8" y="11" width="2" height="1" fill="#0984e3" />
  <rect x="9" y="10" width="1" height="1" fill="#74b9ff" />

  <!-- Big Fiery Head (Top-Right explosion puff) -->
  <!-- Outline -->
  <rect x="9" y="3" width="5" height="5" fill="#0984e3" />
  <!-- Blue layer -->
  <rect x="10" y="3" width="4" height="4" fill="#74b9ff" />
  <rect x="9" y="4" width="5" height="2" fill="#74b9ff" />
  <!-- Cyan layer -->
  <rect x="10" y="4" width="3" height="3" fill="#00d2d3" />
  <!-- White hot core -->
  <rect x="11" y="4" width="2" height="2" fill="#ffffff" />
  <rect x="12" y="3" width="1" height="3" fill="#ffffff" />
  
  <!-- Small sparks in top-right and around head -->
  <rect x="14" y="2" width="1" height="1" fill="#ffffff" />
  <rect x="8" y="2" width="1" height="1" fill="#afeeee" />
  <rect x="14" y="5" width="1" height="1" fill="#74b9ff" />
  <rect x="10" y="8" width="1" height="1" fill="#0984e3" />
</svg>
