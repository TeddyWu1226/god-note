<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="100%" height="100%" shape-rendering="crispEdges">
  <rect x="0.5" y="0.5" width="15" height="15" fill="none" stroke="#3d3d4e" stroke-width="1" rx="0.5" ry="0.5" />
  
  <!-- Outer Glacial Ring (Deep Blue / Cyan Glow) -->
  <rect x="5" y="2" width="6" height="1" fill="#0984e3" />
  <rect x="5" y="13" width="6" height="1" fill="#0984e3" />
  <rect x="2" y="5" width="1" height="6" fill="#0984e3" />
  <rect x="13" y="5" width="1" height="6" fill="#0984e3" />
  <rect x="3" y="3" width="2" height="1" fill="#0984e3" />
  <rect x="11" y="3" width="2" height="1" fill="#0984e3" />
  <rect x="3" y="12" width="2" height="1" fill="#0984e3" />
  <rect x="11" y="12" width="2" height="1" fill="#0984e3" />
  <rect x="2" y="4" width="1" height="1" fill="#0984e3" />
  <rect x="13" y="4" width="1" height="1" fill="#0984e3" />
  <rect x="2" y="11" width="1" height="1" fill="#0984e3" />
  <rect x="13" y="11" width="1" height="1" fill="#0984e3" />

  <!-- Inner Octagonal Ring (Cyan / Light Blue) -->
  <rect x="6" y="3" width="4" height="1" fill="#74b9ff" />
  <rect x="6" y="12" width="4" height="1" fill="#74b9ff" />
  <rect x="3" y="6" width="1" height="4" fill="#74b9ff" />
  <rect x="12" y="6" width="1" height="4" fill="#74b9ff" />
  <rect x="4" y="4" width="2" height="2" fill="#74b9ff" />
  <rect x="10" y="4" width="2" height="2" fill="#74b9ff" />
  <rect x="4" y="10" width="2" height="2" fill="#74b9ff" />
  <rect x="10" y="10" width="2" height="2" fill="#74b9ff" />

  <!-- Magic Sigil Cross (Inner Cyan Lines) -->
  <rect x="7" y="4" width="2" height="8" fill="#00d2d3" />
  <rect x="4" y="7" width="8" height="2" fill="#00d2d3" />

  <!-- Bright White Center Core -->
  <rect x="6" y="6" width="4" height="4" fill="#ffffff" />
  <rect x="7" y="7" width="2" height="2" fill="#74b9ff" />
  <rect x="7" y="6" width="2" height="1" fill="#ffffff" />
  <rect x="7" y="9" width="2" height="1" fill="#ffffff" />
  <rect x="6" y="7" width="1" height="2" fill="#ffffff" />
  <rect x="9" y="7" width="1" height="2" fill="#ffffff" />

  <!-- Corner Sparkles -->
  <rect x="4" y="3" width="1" height="1" fill="#ffffff" />
  <rect x="11" y="3" width="1" height="1" fill="#ffffff" />
  <rect x="4" y="12" width="1" height="1" fill="#ffffff" />
  <rect x="11" y="12" width="1" height="1" fill="#ffffff" />

  <!-- Extra glowing embers -->
  <rect x="8" y="1" width="1" height="1" fill="#ffffff" />
  <rect x="8" y="14" width="1" height="1" fill="#ffffff" />
</svg>
