<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="100%" height="100%" shape-rendering="crispEdges">
  <rect x="0.5" y="0.5" width="15" height="15" fill="none" stroke="#3d3d4e" stroke-width="1" rx="0.5" ry="0.5" />
  <!-- Explosion blast of flames -->
  <rect x="7" y="2" width="2" height="12" fill="#eb3b5a" />
  <rect x="2" y="7" width="12" height="2" fill="#eb3b5a" />

  <!-- Diagonals -->
  <rect x="4" y="4" width="2" height="2" fill="#fa8231" />
  <rect x="10" y="4" width="2" height="2" fill="#fa8231" />
  <rect x="4" y="10" width="2" height="2" fill="#fa8231" />
  <rect x="10" y="10" width="2" height="2" fill="#fa8231" />

  <!-- Center white hot core -->
  <rect x="6" y="6" width="4" height="4" fill="#ffffff" />
  <rect x="5" y="7" width="6" height="2" fill="#ffffff" />
  <rect x="7" y="5" width="2" height="6" fill="#ffffff" />

  <!-- Outer sparks -->
  <rect x="3" y="2" width="1" height="1" fill="#f7b731" />
  <rect x="12" y="2" width="1" height="1" fill="#f7b731" />
  <rect x="3" y="13" width="1" height="1" fill="#f7b731" />
  <rect x="12" y="13" width="1" height="1" fill="#f7b731" />
</svg>
