<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="100%" height="100%" shape-rendering="crispEdges">
  <rect x="0.5" y="0.5" width="15" height="15" fill="none" stroke="#3d3d4e" stroke-width="1" rx="0.5" ry="0.5" />
  
  <!-- Burning Ring on the Ground -->
  <ellipse cx="8" cy="12.5" rx="5" ry="1.5" fill="none" stroke="#eb3b5a" stroke-width="1" />
  <ellipse cx="8" cy="12.5" rx="4" ry="1" fill="none" stroke="#fa8231" stroke-width="1" />

  <!-- Protective Flame walls on the sides -->
  <rect x="3" y="6" width="1" height="6" fill="#eb3b5a" />
  <rect x="4" y="8" width="1" height="4" fill="#fa8231" />
  <rect x="12" y="6" width="1" height="6" fill="#eb3b5a" />
  <rect x="11" y="8" width="1" height="4" fill="#fa8231" />

  <!-- Fiery Shield standing in the center -->
  <!-- Outline -->
  <rect x="6" y="4" width="4" height="1" fill="#eb3b5a" />
  <rect x="5" y="5" width="6" height="3" fill="#eb3b5a" />
  <rect x="6" y="8" width="4" height="2" fill="#eb3b5a" />
  <rect x="7" y="10" width="2" height="1" fill="#eb3b5a" />
  
  <!-- Core Shield -->
  <rect x="6" y="5" width="4" height="3" fill="#ffffff" />
  <rect x="7" y="8" width="2" height="1" fill="#f7b731" />
  <rect x="7" y="5" width="2" height="3" fill="#fa8231" />

  <!-- Sparks -->
  <rect x="5" y="2" width="1" height="1" fill="#ffffff" />
  <rect x="10" y="2" width="1" height="1" fill="#ffffff" />
</svg>
