<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="100%" height="100%" shape-rendering="crispEdges">
  <rect x="0.5" y="0.5" width="15" height="15" fill="none" stroke="#3d3d4e" stroke-width="1" rx="0.5" ry="0.5" />
  
  <!-- Burning Ring on the Ground (Ellipse in perspective) -->
  <ellipse cx="8" cy="12.5" rx="5" ry="1.5" fill="none" stroke="#eb3b5a" stroke-width="1" />
  <ellipse cx="8" cy="12.5" rx="4" ry="1" fill="none" stroke="#fa8231" stroke-width="1" />
  <ellipse cx="8" cy="12.5" rx="2" ry="0.5" fill="none" stroke="#ffffff" stroke-width="1" />

  <!-- Roaring Flames rising upwards (Vertical flame pillars) -->
  <!-- Left flame pillar -->
  <rect x="4" y="6" width="1" height="6" fill="#eb3b5a" />
  <rect x="4" y="4" width="1" height="2" fill="#fa8231" />
  <rect x="5" y="5" width="1" height="7" fill="#fa8231" />
  <rect x="5" y="3" width="1" height="2" fill="#f7b731" />
  <rect x="6" y="6" width="1" height="6" fill="#ffffff" />
  <rect x="6" y="2" width="1" height="6" fill="#fa8231" />

  <!-- Center flame pillar -->
  <rect x="7" y="3" width="2" height="9" fill="#fa8231" />
  <rect x="7" y="2" width="2" height="1" fill="#eb3b5a" />
  <rect x="7" y="4" width="2" height="6" fill="#f7b731" />
  <rect x="8" y="5" width="1" height="4" fill="#ffffff" />

  <!-- Right flame pillar -->
  <rect x="11" y="6" width="1" height="6" fill="#eb3b5a" />
  <rect x="11" y="4" width="1" height="2" fill="#fa8231" />
  <rect x="10" y="5" width="1" height="7" fill="#fa8231" />
  <rect x="10" y="3" width="1" height="2" fill="#f7b731" />
  <rect x="9" y="3" width="1" height="8" fill="#ffffff" />

  <!-- Sparkles/embers floating up -->
  <rect x="3" y="3" width="1" height="1" fill="#fa8231" />
  <rect x="2" y="6" width="1" height="1" fill="#fa8231" />
  <rect x="12" y="3" width="1" height="1" fill="#fa8231" />
  <rect x="13" y="6" width="1" height="1" fill="#fa8231" />
  <rect x="6" y="2" width="1" height="1" fill="#ffffff" />
  <rect x="9" y="2" width="1" height="1" fill="#ffffff" />
</svg>
