<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="100%" height="100%" shape-rendering="crispEdges">
  <rect x="0.5" y="0.5" width="15" height="15" fill="none" stroke="#3d3d4e" stroke-width="1" rx="0.5" ry="0.5" />
  
  <!-- Outer Runic Ring (Red / Purple Glow) -->
  <!-- Top & Bottom arcs -->
  <rect x="5" y="2" width="6" height="1" fill="#eb3b5a" />
  <rect x="5" y="13" width="6" height="1" fill="#eb3b5a" />
  <!-- Left & Right arcs -->
  <rect x="2" y="5" width="1" height="6" fill="#eb3b5a" />
  <rect x="13" y="5" width="1" height="6" fill="#eb3b5a" />
  <!-- Corner arcs -->
  <rect x="3" y="3" width="2" height="1" fill="#eb3b5a" />
  <rect x="11" y="3" width="2" height="1" fill="#eb3b5a" />
  <rect x="3" y="12" width="2" height="1" fill="#eb3b5a" />
  <rect x="11" y="12" width="2" height="1" fill="#eb3b5a" />
  <rect x="2" y="4" width="1" height="1" fill="#eb3b5a" />
  <rect x="13" y="4" width="1" height="1" fill="#eb3b5a" />
  <rect x="2" y="11" width="1" height="1" fill="#eb3b5a" />
  <rect x="13" y="11" width="1" height="1" fill="#eb3b5a" />

  <!-- Inner Octagonal Magic Ring (Orange / Gold) -->
  <rect x="6" y="3" width="4" height="1" fill="#fa8231" />
  <rect x="6" y="12" width="4" height="1" fill="#fa8231" />
  <rect x="3" y="6" width="1" height="4" fill="#fa8231" />
  <rect x="12" y="6" width="1" height="4" fill="#fa8231" />
  <rect x="4" y="4" width="2" height="2" fill="#fa8231" />
  <rect x="10" y="4" width="2" height="2" fill="#fa8231" />
  <rect x="4" y="10" width="2" height="2" fill="#fa8231" />
  <rect x="10" y="10" width="2" height="2" fill="#fa8231" />

  <!-- Magic Sigil Cross (Inner Gold Lines) -->
  <rect x="7" y="4" width="2" height="8" fill="#f7b731" />
  <rect x="4" y="7" width="8" height="2" fill="#f7b731" />

  <!-- Bright White-Hot Center Runic Core -->
  <rect x="6" y="6" width="4" height="4" fill="#ffffff" />
  <!-- Inner orange glow inside core -->
  <rect x="7" y="7" width="2" height="2" fill="#fa8231" />
  <rect x="7" y="6" width="2" height="1" fill="#ffffff" />
  <rect x="7" y="9" width="2" height="1" fill="#ffffff" />
  <rect x="6" y="7" width="1" height="2" fill="#ffffff" />
  <rect x="9" y="7" width="1" height="2" fill="#ffffff" />

  <!-- Four Cross Sparkles (+) in the outer corners representing intense heat energy -->
  <!-- Top-Left Sparkle -->
  <rect x="4" y="3" width="1" height="1" fill="#ffffff" />
  <!-- Top-Right Sparkle -->
  <rect x="11" y="3" width="1" height="1" fill="#ffffff" />
  <!-- Bottom-Left Sparkle -->
  <rect x="4" y="12" width="1" height="1" fill="#ffffff" />
  <!-- Bottom-Right Sparkle -->
  <rect x="11" y="12" width="1" height="1" fill="#ffffff" />

  <!-- Extra glowing embers radiating out -->
  <rect x="8" y="1" width="1" height="1" fill="#ffffff" />
  <rect x="8" y="14" width="1" height="1" fill="#ffffff" />
  <rect x="1" y="8" width="1" height="1" fill="#ffffff" />
  <rect x="14" y="8" width="1" height="1" fill="#ffffff" />
  <rect x="3" y="8" width="1" height="1" fill="#ffffff" />
  <rect x="12" y="8" width="1" height="1" fill="#ffffff" />
</svg>
