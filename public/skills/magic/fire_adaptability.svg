<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="100%" height="100%" shape-rendering="crispEdges">
  <!-- Small Fire Spark (Tiny Flame Shape at Center) -->
  <!-- Outer Red Outline -->
  <rect x="8" y="3" width="2" height="1" fill="#d63031" />
  <rect x="7" y="4" width="2" height="1" fill="#d63031" />
  <rect x="6" y="5" width="4" height="2" fill="#d63031" />
  <rect x="5" y="7" width="6" height="4" fill="#d63031" />
  <rect x="6" y="11" width="4" height="1" fill="#d63031" />

  <!-- Mid Orange Outline -->
  <rect x="7" y="5" width="2" height="1" fill="#e17055" />
  <rect x="6" y="6" width="4" height="1" fill="#e17055" />
  <rect x="6" y="7" width="4" height="3" fill="#e17055" />
  <rect x="7" y="10" width="2" height="1" fill="#e17055" />

  <!-- Yellow Core -->
  <rect x="7" y="6" width="2" height="1" fill="#fdcb6e" />
  <rect x="7" y="7" width="2" height="2" fill="#fdcb6e" />
  <rect x="7" y="9" width="2" height="1" fill="#fdcb6e" />

  <!-- White Sparkle Core -->
  <rect x="7" y="7" width="1" height="1" fill="#ffffff" />
  <rect x="8" y="8" width="1" height="1" fill="#ffffff" />

</svg>
