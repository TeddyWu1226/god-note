<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="100%" height="100%" shape-rendering="crispEdges">
  <!-- Retro Item Frame (Border Only, Transparent Background) -->
  <rect x="0.5" y="0.5" width="15" height="15" fill="none" stroke="#3d3d4e" stroke-width="1" rx="0.5" ry="0.5" />

  <!-- Shield Core (Blue/Cyan magical shield) -->
  <rect x="4" y="3" width="8" height="1" fill="#74b9ff" />
  <rect x="3" y="4" width="10" height="4" fill="#2e86de" />
  <rect x="4" y="8" width="8" height="2" fill="#2e86de" />
  <rect x="6" y="10" width="4" height="2" fill="#0984e3" />
  <rect x="7" y="12" width="2" height="1" fill="#0984e3" />

  <!-- Magic runes / sparkles inside shield -->
  <rect x="6" y="5" width="4" height="2" fill="#a5d8ff" />
  <rect x="7" y="7" width="2" height="2" fill="#ffffff" />
</svg>
