<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="100%" height="100%" shape-rendering="crispEdges">
  <!-- Retro Item Frame (Border Only, Transparent Background) -->
  <rect x="0.5" y="0.5" width="15" height="15" fill="none" stroke="#3d3d4e" stroke-width="1" rx="0.5" ry="0.5" />

  <!-- Power Aura (Golden / Orange Charging Energy) -->
  <!-- Inner bright core -->
  <rect x="7" y="7" width="2" height="2" fill="#ffffff" />
  <rect x="7" y="6" width="2" height="1" fill="#f1c40f" />
  <rect x="7" y="9" width="2" height="1" fill="#f1c40f" />
  <rect x="6" y="7" width="1" height="2" fill="#f1c40f" />
  <rect x="9" y="7" width="1" height="2" fill="#f1c40f" />

  <!-- Medium orange ring -->
  <rect x="6" y="5" width="4" height="1" fill="#e67e22" />
  <rect x="6" y="10" width="4" height="1" fill="#e67e22" />
  <rect x="5" y="6" width="1" height="4" fill="#e67e22" />
  <rect x="10" y="6" width="1" height="4" fill="#e67e22" />

  <!-- Outer red sparks/fire -->
  <rect x="7" y="3" width="2" height="1" fill="#e74c3c" />
  <rect x="7" y="12" width="2" height="1" fill="#e74c3c" />
  <rect x="3" y="7" width="1" height="2" fill="#e74c3c" />
  <rect x="12" y="7" width="1" height="2" fill="#e74c3c" />

  <!-- Diagonal charging sparks -->
  <rect x="4" y="4" width="1" height="1" fill="#f1c40f" />
  <rect x="11" y="4" width="1" height="1" fill="#f1c40f" />
  <rect x="4" y="11" width="1" height="1" fill="#f1c40f" />
  <rect x="11" y="11" width="1" height="1" fill="#f1c40f" />

  <rect x="5" y="3" width="1" height="1" fill="#e67e22" />
  <rect x="10" y="3" width="1" height="1" fill="#e67e22" />
  <rect x="3" y="5" width="1" height="1" fill="#e67e22" />
  <rect x="12" y="5" width="1" height="1" fill="#e67e22" />
  <rect x="3" y="10" width="1" height="1" fill="#e67e22" />
  <rect x="12" y="10" width="1" height="1" fill="#e67e22" />
  <rect x="5" y="12" width="1" height="1" fill="#e67e22" />
  <rect x="10" y="12" width="1" height="1" fill="#e67e22" />
</svg>
