<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="100%" height="100%" shape-rendering="crispEdges">
  <!-- Retro Item Frame -->
  <rect width="16" height="16" fill="#121216" rx="1" ry="1" />
  <rect x="1" y="1" width="14" height="14" fill="#3d3d4e" />
  <rect x="2" y="2" width="12" height="12" fill="#1b1c20" />

  <!-- Shield Base: Gold Borders & Steel Plate -->
  <!-- Gold Border Outline -->
  <rect x="4" y="3" width="8" height="1" fill="#d35400" />
  <rect x="3" y="4" width="10" height="1" fill="#f1c40f" />
  <rect x="3" y="5" width="2" height="4" fill="#f1c40f" />
  <rect x="11" y="5" width="2" height="4" fill="#f1c40f" />
  <rect x="4" y="9" width="1" height="2" fill="#f1c40f" />
  <rect x="11" y="9" width="1" height="2" fill="#f1c40f" />
  <rect x="5" y="11" width="2" height="1" fill="#f1c40f" />
  <rect x="9" y="11" width="2" height="1" fill="#f1c40f" />
  <rect x="7" y="12" width="2" height="1" fill="#f1c40f" />

  <!-- Shield Steel plate (dark slate gray background inside border) -->
  <rect x="5" y="5" width="6" height="6" fill="#4f5d75" />
  <rect x="4" y="6" width="8" height="3" fill="#4f5d75" />
  <rect x="7" y="11" width="2" height="1" fill="#4f5d75" />

  <!-- Ruby Heart (Vitality Emblem) -->
  <!-- Top half of Heart -->
  <rect x="5" y="6" width="2" height="1" fill="#e74c3c" />
  <rect x="9" y="6" width="2" height="1" fill="#e74c3c" />
  <!-- Center/Bottom of Heart -->
  <rect x="5" y="7" width="6" height="2" fill="#e74c3c" />
  <rect x="6" y="9" width="4" height="1" fill="#e74c3c" />
  <rect x="7" y="10" width="2" height="1" fill="#e74c3c" />

  <!-- Heart Highlights & Shadows -->
  <rect x="5" y="7" width="1" height="1" fill="#ffffff" />
  <rect x="6" y="6" width="1" height="1" fill="#ffffff" />
  <rect x="10" y="7" width="1" height="1" fill="#c0392b" />
  <rect x="9" y="8" width="1" height="1" fill="#c0392b" />
  <rect x="8" y="9" width="1" height="1" fill="#c0392b" />

  <!-- Shield metal shine -->
  <rect x="4" y="5" width="1" height="1" fill="#d1d5db" />
  <rect x="11" y="5" width="1" height="1" fill="#d1d5db" />
</svg>
