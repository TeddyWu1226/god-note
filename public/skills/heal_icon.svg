<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="100%" height="100%" shape-rendering="crispEdges">
  <!-- Retro Item Frame (Border Only, Transparent Background) -->
  <rect x="0.5" y="0.5" width="15" height="15" fill="none" stroke="#3d3d4e" stroke-width="1" rx="0.5" ry="0.5" />

  <!-- Holy Sparkles (Yellow/Gold) -->
  <rect x="3" y="3" width="1" height="1" fill="#f1c40f" />
  <rect x="4" y="4" width="1" height="1" fill="#f39c12" />
  <rect x="12" y="3" width="1" height="1" fill="#f1c40f" />
  <rect x="11" y="4" width="1" height="1" fill="#f39c12" />
  <rect x="3" y="12" width="1" height="1" fill="#f1c40f" />
  <rect x="4" y="11" width="1" height="1" fill="#f39c12" />
  <rect x="12" y="12" width="1" height="1" fill="#f1c40f" />
  <rect x="11" y="11" width="1" height="1" fill="#f39c12" />

  <!-- Green Cross (Healing) -->
  <!-- Dark Green outline/shadow -->
  <rect x="7" y="4" width="2" height="8" fill="#1e6f3d" />
  <rect x="5" y="6" width="6" height="2" fill="#1e6f3d" />
  
  <!-- Bright Green Core -->
  <rect x="7" y="5" width="2" height="6" fill="#2ecc71" />
  <rect x="6" y="7" width="4" height="2" fill="#2ecc71" />
  
  <!-- Holy White Inner Glow -->
  <rect x="7" y="7" width="2" height="2" fill="#ffffff" />
  
  <!-- Extra healing particles -->
  <rect x="5" y="4" width="1" height="1" fill="#a2f2b7" />
  <rect x="10" y="11" width="1" height="1" fill="#a2f2b7" />
</svg>
